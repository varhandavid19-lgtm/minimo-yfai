/* ===== Excel / CSV ===== */
let xlsxP=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxP) return xlsxP;
  xlsxP = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=()=>rej(new Error(T('Nepodařilo se stáhnout knihovnu pro čtení Excelu. Ulož soubor jako CSV a nahraj ho znovu.')));
    document.head.appendChild(s);
  });
  return xlsxP;
}
function csvToAoa(text){
  const rows=[]; let row=[], cur='', q=false;
  const push=()=>{row.push(cur);cur='';};
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t') push();
    else if(c==='\n'){ push(); rows.push(row); row=[]; }
    else if(c!=='\r') cur+=c;
  }
  push(); if(row.length>1||row[0]) rows.push(row);
  return rows;
}
async function readFileAoa(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.txt')) return csvToAoa(await file.text());
  const XLSX = await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), {cellDates:false});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null, blankrows:false});
}

/* Excelové sériové datum (UTC, ať se nic neposune o hodinu). */
function fromSerial(n){
  if(!isFinite(n)) return null;
  const ms=Math.round((n-25569)*86400*1000);
  return new Date(ms);
}
/* Rozpozná číslo i s čárkou/mezerami jako oddělovači. */
function toNum(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let s=String(v).trim().replace(/\s/g,'').replace(/ /g,'');
  // "1 234,56" -> 1234.56 ; "1,234.56" -> 1234.56
  if(s.includes(',')&&s.includes('.')){ s=s.replace(/\./g,'').replace(',','.'); }
  else if(s.includes(',')){ s=s.replace(',','.'); }
  const n=parseFloat(s);
  return isFinite(n)?n:null;
}
/* Je číslo v rozsahu, kde dává smysl jako excelové sériové datum (cca 2009–2119)? */
const looksSerial = n => typeof n==='number' && isFinite(n) && n>=40000 && n<=80000;
/* Pokusí se z buňky udělat Date — jen z věcí, co opravdu vypadají jako datum/čas
   (sériové číslo, Date, ISO, "DD.MM.YYYY HH:MM"). Krátký text typu „12" NENÍ datum. */
function toDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:v;
  if(typeof v==='number') return looksSerial(v)?fromSerial(v):null;
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return new Date(Date.UTC(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)));
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)));
  // jen řetězce, které opravdu vypadají na datum (oddělovač + dost dlouhé)
  if(s.length>=8 && /[-/.:]/.test(s) && /\d{2,4}/.test(s)){ const d=new Date(s); if(!isNaN(d)) return d; }
  return null;
}

/* Z pole řádků najde sloupec s časem a sloupec s hodnotou a spočítá souhrn.
   valCol / timeCol lze vynutit (indexy); jinak se hádají automaticky. */
function analyze(aoa, opt={}){
  opt = opt||{};
  // najdi řádek záhlaví = první řádek, kde je aspoň jedna textová buňka a pod ním čísla
  let headRow=-1;
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const r=aoa[i]||[];
    if(r.some(c=>typeof c==='string'&&c.trim().length)){ headRow=i; break; }
  }
  const header=(headRow>=0?aoa[headRow]:[]).map(c=>String(c==null?'':c).trim());
  const dataRows=aoa.slice(headRow>=0?headRow+1:0);
  const nc=Math.max(header.length, ...dataRows.slice(0,50).map(r=>r?r.length:0), 1);
  // skóre sloupců: kolik buněk je číslo (ne datum) a kolik vypadá jako datum/čas
  const numHits=new Array(nc).fill(0), dateHits=new Array(nc).fill(0);
  for(const r of dataRows){ if(!r) continue;
    for(let c=0;c<nc;c++){ const v=r[c];
      const isDate = toDate(v)!=null;        // sériové číslo v rozsahu dat, Date, nebo datumový řetězec
      if(isDate) dateHits[c]++;
      else if(toNum(v)!=null) numHits[c]++;   // číslo, které NENÍ datum = kandidát na hodnotu
    }
  }
  const reVal=/spot|consum|odb[ěe]r|kwh|mwh|m3|m³|hodnot|value|energ|množ/i;
  const reTime=/datum|[čc]as|time|\bod\b|from|start|timestamp|interval|p[ůu]lhod|[čc]tvrt/i;
  // sloupec času: podle názvu, jinak sloupec s nejvíc datumovými buňkami
  let timeCol = opt.timeCol;
  if(timeCol==null){
    timeCol = header.findIndex(h=>reTime.test(h));
    if(timeCol<0){ let best=-1,bn=0; for(let c=0;c<nc;c++){ if(dateHits[c]>bn){bn=dateHits[c];best=c;} } timeCol=best; }
  }
  // sloupec hodnoty: podle názvu, jinak sloupec s nejvíc čísly, který NENÍ sloupec času
  let valCol = opt.valCol;
  if(valCol==null){
    valCol = header.findIndex(h=>reVal.test(h));
    if(valCol<0){ let best=-1,bn=-1; for(let c=0;c<nc;c++){ if(c===timeCol) continue; if(numHits[c]>bn){bn=numHits[c];best=c;} } valCol=best; }
  }
  // posbírej hodnoty
  let total=0, cnt=0, maxV=-Infinity, maxAt=null;
  const monthCount={};
  for(const r of dataRows){ if(!r) continue;
    const v=toNum(r[valCol]); if(v==null) continue;
    total+=v; cnt++;
    if(v>maxV){ maxV=v; maxAt = timeCol>=0 ? toDate(r[timeCol]) : null; }
    if(timeCol>=0){ const d=toDate(r[timeCol]); if(d){ const k=monthKey(d.getUTCFullYear(),d.getUTCMonth()+1); monthCount[k]=(monthCount[k]||0)+1; } }
  }
  // nejčastější měsíc v datech
  let guessY=null,guessM=null;
  const mk=Object.entries(monthCount).sort((a,b)=>b[1]-a[1])[0];
  if(mk){ const p=mk[0].split('-'); guessY=+p[0]; guessM=+p[1]; }
  return {header,nc,valCol,timeCol,total,cnt,maxV:isFinite(maxV)?maxV:0,
    maxAt:maxAt?maxAt.toISOString():null, guessY, guessM};
}

let unsub=null, unsubCfg=null;
function startWatch(){
  stopWatch();
  unsub = onSnapshot(collection(db,'energy'), snap=>{
    rows = snap.docs.map(d=>Object.assign({_id:d.id}, d.data()));
    dataReady=true;
    if(!selKey) selKey = latestKey();
    render();
  }, err=>{ fatalErr=err.message||String(err); render(); });
  unsubCfg = onSnapshot(doc(db,'meta','energycfg'), s=>{ cfg = s.exists()?s.data():{recipients:''}; render(); }, ()=>{});
}
function stopWatch(){ if(unsub){unsub();unsub=null;} if(unsubCfg){unsubCfg();unsubCfg=null;} }

function barSvg(data,color,dec){
  if(!data.some(d=>d.has)) return `<div class="empty">${T('Zatím žádná data. Začni importem Excelu.')}</div>`;
  const W=560,H=190,ml=8,mr=8,mt=14,mb=34,iw=W-ml-mr,ih=H-mt-mb;
  const max=Math.max(...data.map(d=>d.val))||1;
  const step=iw/data.length, bw=Math.min(40,step-8);
  const bars=data.map((d,i)=>{
    const h=d.has?Math.max(2,ih*d.val/max):0, x=ml+step*i+(step-bw)/2, y=mt+ih-h;
    return `${d.has?`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}"><title>${esc(d.label)} ${d.y}: ${num(d.val,dec)}</title></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#41506b">${num(d.val,dec)}</text>`:''}
      <text x="${(ml+step*i+step/2).toFixed(1)}" y="${(mt+ih+14).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#6b7a90">${esc(d.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${ml}" y1="${mt+ih}" x2="${ml+iw}" y2="${mt+ih}" stroke="#dde4ec"/>${bars}</svg>`;
}

function i18nToast(m){
  if(!window.T||!window.minimoLang||window.minimoLang()!=='en'||typeof m!=='string') return m;
  const full=window.T(m); if(full!==m) return full;
  const i=m.indexOf(': '); if(i>0){ const p=m.slice(0,i+2); const tp=window.T(p); if(tp!==p) return tp+m.slice(i+2); }
  return m;
}
function toast(m,k=''){ m=i18nToast(m); toastMsg=m; toastKind=k; render(); clearTimeout(toast._t);
  toast._t=setTimeout(()=>{toastMsg=null;render();},4200); }

async function handleFile(file, med){
  if(!file) return;
  imp={med, busy:T('Čtu soubor…')}; render();
  try{
    const aoa=await readFileAoa(file);
    const a=analyze(aoa);
    if(!a.cnt){ imp=null; toast(T('V souboru jsem nenašel žádné ¼h hodnoty.'),'err'); return; }
    const d=new Date(); let gm=a.guessM, gy=a.guessY;
    if(!gm){ // výchozí = minulý měsíc (report se dělá 1. v měsíci)
      const pm=new Date(d.getFullYear(), d.getMonth()-1, 1); gm=pm.getMonth()+1; gy=pm.getFullYear(); }
    imp={med, aoa, a, valCol:a.valCol, timeCol:a.timeCol, month:gm, year:gy, fileName:file.name, busy:''};
    render();
  }catch(e){ imp=null; toast((e&&e.message)||T('Nepodařilo se načíst soubor.'),'err'); }
}

/* ===== bind ===== */
function bind(){
  const f=document.getElementById('loginForm');
  if(f) f.addEventListener('submit',e=>{e.preventDefault();
    doLogin(document.getElementById('li-email').value.trim(), document.getElementById('li-pass').value);});

  // jazykový přepínač a menu modulů obsluhuje header.js sám; tady jen odhlášení
  document.querySelectorAll('[data-a="logout"]').forEach(b=>b.onclick=()=>signOut(auth));

  document.querySelectorAll('[data-a]').forEach(el=>{
    const a=el.getAttribute('data-a');
    if(a==='reload') el.onclick=()=>location.reload();
    if(a==='selmonth') el.onchange=()=>{ selKey=el.value; render(); };
    if(a==='file') el.onchange=()=>{ const file=el.files&&el.files[0]; el.value=''; handleFile(file, el.getAttribute('data-med')); };
    if(a==='imp-cancel'||a==='imp-bg'){ el.onclick=(ev)=>{ if(a==='imp-bg'&&ev.target!==el) return; imp=null; render(); }; }
    if(a==='imp-save') el.onclick=saveImport;
    if(a==='mail-open') el.onclick=openMail;
    if(a==='mail-copy') el.onclick=copyMail;
    if(a==='delmonth') el.onclick=()=>delMonth(el.getAttribute('data-v'));
  });

  // okno kontroly importu — změna voleb přepočítá souhrn
  const vc=document.getElementById('imp-valcol'), tc=document.getElementById('imp-timecol'),
        mo=document.getElementById('imp-month'), yr=document.getElementById('imp-year');
  if(vc) vc.onchange=()=>{ imp.valCol=+vc.value; recalcImp(); render(); };
  if(tc) tc.onchange=()=>{ imp.timeCol=+tc.value; recalcImp(); render(); };
  if(mo) mo.onchange=()=>{ imp.month=+mo.value; render(); };
  if(yr) yr.onchange=()=>{ imp.year=+yr.value; render(); };

  // uložení příjemců e-mailu (při opuštění pole)
  const mt=document.getElementById('mail-to');
  if(mt && canWrite()) mt.onchange=()=>saveRecipients(mt.value.trim());
}

async function delMonth(key){
  if(!canWrite()) return;
  if(!confirm(T('Opravdu smazat tento import?'))) return;
  for(const med of ['el','plyn']){ const r=rowFor(key,med);
    if(r){ try{ await deleteDoc(doc(db,'energy',r._id)); }catch(e){} } }
  toast(T('Import smazán.'),'ok');
}
</script>
<script src="header.js"></script>
