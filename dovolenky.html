<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Plánování směn a přítomnosti — YFAI</title>
<link rel="stylesheet" href="header.css">
<style>
  :root{
    --navy-1:#0f2f5f; --navy-2:#1b4b8f; --panel:#1e4c8a;
    --bg:#f4f6f9; --card:#ffffff; --line:#dde4ec; --text:#16233a; --muted:#6b7a90;
    --green:#1f9254; --red:#c0392b; --amber:#b7791f; --blue:#2563a8;
    --radius:8px; font-synthesis-weight:none;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:8px 13px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid #2a5ea3;outline-offset:0;border-color:#2a5ea3}
  a{color:#2563a8}

  /* ---- hlavička ---- */
  header{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;padding:12px 18px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.1}
  header .sub{font-size:11.5px;opacity:.75;margin-top:2px}
  .brand{background:#fff;border-radius:8px;padding:8px 13px;display:flex;align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.22);flex:none}
  .brand svg{display:block;height:50px;width:auto}
  .chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;
    padding:4px 11px;font-size:11px;white-space:nowrap}
  .btn-logout{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:20px;font-size:11px;padding:5px 13px}
  @media(max-width:640px){header h1{font-size:19px}.brand svg{height:40px}}

  main{padding:16px 22px 46px;max-width:none;margin:0 auto}
  .toprow{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:900px){.toprow{grid-template-columns:1fr}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,47,95,.05)}
  .panel > h2{background:var(--panel);color:#fff;margin:0;font-size:13px;font-weight:700;padding:10px 14px;
    display:flex;align-items:center;gap:9px}
  .panel > h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85}
  .panel .body{padding:14px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f{display:flex;flex-direction:column;gap:5px}
  .f.span2{grid-column:span 2}
  .f label{font-size:12px;font-weight:700;color:#41506b}
  .f .req{color:var(--red)}
  .btn-primary{background:var(--navy-2);color:#fff;font-weight:700}
  .btn-primary:hover{background:#163f78}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-danger{background:var(--red);color:#fff}
  .btn-orange{background:#f6821f;border:1px solid #f6821f;color:#fff;font-weight:700}
  .btn-orange:hover{background:#e8590c;border-color:#e8590c}
  .formfoot{margin-top:10px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .formfoot .msg{font-size:12.5px;font-weight:600}
  .formfoot .msg.err{color:var(--red)}
  .formfoot .msg.ok{color:var(--green)}
  .formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .formrow .f{flex:1 1 150px;min-width:140px}
  .formrow .f.grow{flex:2 1 190px}
  .formrow .f.addbtn{flex:0 0 auto;min-width:0}
  .formrow .f.addbtn button{padding:9px 24px}
  .formrow .f.dcount{flex:0 0 92px;min-width:80px}

  .tabbar{background:#fff;border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:4px}
  .tab{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;
    padding:12px 16px;font-size:13.5px;font-weight:700;color:#6b7a90}
  .tab:hover{color:var(--navy-2)}
  .tab.active{color:var(--navy-1);border-bottom-color:#f6821f}
  .tabbar{align-items:center}
  .tb-note{margin-left:auto;font-size:11.5px;color:var(--muted);padding:0 4px;white-space:nowrap}
  @media(max-width:680px){.tb-note{display:none}}

  .settings{max-width:1200px}
  .statsyear{display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-size:12.5px;color:#41506b}
  .statsyear b{font-size:14px;color:var(--navy-1);min-width:46px;text-align:center}
  .nav.sm{width:30px;height:30px;font-size:15px}
  .addperson input{flex:1;min-width:150px}
  .tblwrap{overflow-x:auto}
  .ptable{width:100%;border-collapse:collapse;font-size:13px}
  .ptable th{background:#16355f;color:#fff;text-align:left;padding:9px 11px;font-size:10.5px;
    letter-spacing:.5px;text-transform:uppercase;font-weight:700}
  .ptable th.num{text-align:right}
  .ptable td{padding:8px 11px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  .ptable tbody tr:hover td{background:#f7f9fc}
  .ptable td.nm{font-weight:600;white-space:nowrap}
  .ptable td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ptable td.num b{font-size:14px;color:var(--navy-1)}
  .ptable td.num b.neg{color:var(--red)}
  .ptable td.num .of{color:var(--muted);font-size:11px}
  .ptable td.ta-c{text-align:center}
  .ptable .proc{padding:6px 8px;font-size:12.5px;max-width:280px}
  .ptable .rm{background:transparent;border:0;color:#9aa7b8;font-size:16px;line-height:1;padding:2px 6px}
  .ptable .rm:hover{color:var(--red)}
  .ptable .tempty{color:var(--muted);text-align:center;padding:22px}
  .ptable.bonus tr.zero td{color:#9aa7b8}
  .ptable.bonus tfoot td{background:#eef3fb;border-top:2px solid #c3d0e2;font-weight:700;padding:9px 11px}
  .tab.tab-bonus{margin-left:12px}
  .tabbar{overflow-x:auto;max-width:100vw}
  .tabbar .tab{flex:none;white-space:nowrap}

  /* ---- lidé ---- */
  .people{display:flex;flex-direction:column;gap:7px;max-height:210px;overflow:auto}
  .prow{display:flex;align-items:center;gap:8px;background:#f7f9fc;border:1px solid var(--line);
    border-radius:8px;padding:7px 8px 7px 12px}
  .prow .pinfo{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
  .prow .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .vac{font-size:11px;color:var(--muted)}
  .prow .vac b{color:#41506b;font-variant-numeric:tabular-nums}
  .prow .vac b.neg{color:var(--red)}
  .prow button{background:transparent;border:0;color:#9aa7b8;font-size:16px;line-height:1;padding:2px 6px}
  .prow button:hover{color:var(--red)}
  .addperson{display:flex;gap:8px;margin-bottom:11px}
  .addperson input{flex:1}

  /* ---- legenda ---- */
  .twoforms{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
  @media(max-width:900px){.twoforms{grid-template-columns:1fr}}
  .legend .lg-h{font-weight:800;color:#41506b;margin-right:2px}
  .legend+.legend{margin-top:-6px}
  .hintmini{font-size:11.5px;color:var(--muted);flex:1;min-width:180px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 14px;margin-bottom:12px;
    background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px;color:#41506b}
  .legend .item{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .legend .sw{width:20px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}

  /* ---- kalendář ---- */
  .calbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .calbar .yr{font-size:17px;font-weight:800;color:var(--navy-1);min-width:230px;text-align:center}
  .calbar button.nav{background:#fff;border:1px solid var(--line);color:var(--navy-2);font-size:16px;
    font-weight:800;width:38px;height:38px;border-radius:10px;padding:0}
  .calbar button.nav:hover{background:#eef3fb}
  .calbar .hint{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .calbar{flex-wrap:wrap}
  .calbar>*{flex:none}
  .viewsw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .viewsw button{border:0;border-radius:0;background:#fff;color:#41506b;font-weight:700;padding:9px 14px}
  .viewsw button+button{border-left:1px solid var(--line)}
  .viewsw button.on{background:var(--navy-2);color:#fff}

  .cal-wrap{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  table.cal{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px}
  .cal col.namecol{width:190px}
  .cal col.dcol{width:29px}
  .cal th,.cal td{border-right:1px solid #eef1f6;border-bottom:1px solid #eef1f6;text-align:center;padding:0;height:33px}
  .cal thead th{background:#f7f9fc;color:#41506b;font-weight:700;user-select:none}
  .cal tr.months th{position:sticky;top:0;z-index:4;height:27px;font-size:12px;letter-spacing:.4px;
    text-transform:uppercase;background:#e7eefb;color:var(--navy-2);border-bottom:1px solid #d0dcef}
  .cal tr.months th.malt{background:#dbe6f7}
  .cal tr.days th{position:sticky;top:27px;z-index:4;height:31px;font-size:11px;color:#5b6b82;font-weight:600;line-height:1.05}
  .cal tr.days th .wd{display:block;font-size:8.5px;font-weight:600;color:#aab4c2}
  .cal tr.days th.today .wd{color:#ffe6d5}
  .cal .malt{background:#f1f4fa}
  .cal .corner{position:sticky;left:0;z-index:7;background:#e7eefb;text-align:left;padding:0 12px;
    box-shadow:2px 0 0 #d0dcef}
  .cal tr.months th.corner{z-index:8;font-size:13px}
  .cal tr.days th.corner{z-index:8;background:#f7f9fc;font-size:11px;text-transform:none;letter-spacing:0;color:#41506b}
  .cal td.name{position:sticky;left:0;z-index:3;background:#fff;text-align:left;padding:0 12px;font-weight:600;
    font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:2px 0 0 #e6ebf2}
  .cal tbody tr:hover td.name{background:#f7f9fc}
  /* řádek pod myší a řádek, na kterém se pracuje (klik), žlutě s oranžovým proužkem —
     stejně jako tabulka uživatelů v Nastavení. Barevná políčka (inline barva) zůstanou. */
  .cal tbody tr[data-prow]:hover td,.cal tbody tr.active td{background-color:#fff1c7}
  .cal tbody tr[data-prow]:hover td.name,.cal tbody tr.active td.name{background:#fff1c7;box-shadow:inset 4px 0 0 #f6821f,2px 0 0 #e6ebf2}
  .cal td.d{cursor:pointer;user-select:none}
  /* označené dny (tažením) — oranžový rámeček a lehký přeliv přes barvu záznamu */
  .cal td.d.sel{box-shadow:inset 0 0 0 2px #e8590c !important;
    background-image:linear-gradient(rgba(246,130,31,.32),rgba(246,130,31,.32)) !important}
  /* lišta dole s volbami pro označené dny */
  .selbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;width:min(1100px,calc(100vw - 24px));
    background:#fff;border:1px solid #c3d0e2;border-radius:14px;box-shadow:0 14px 40px rgba(12,26,48,.28);padding:10px 14px;
    display:flex;flex-direction:column;gap:7px;max-height:60vh;overflow:auto}
  .sb-head{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--navy-1)}
  .sb-head .muted{color:var(--muted);font-size:12px}
  .sb-x{margin-left:auto;background:transparent;border:0;font-size:18px;color:#6b7a90;padding:0 4px}
  .sb-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sb-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#6b7a90;width:96px;flex:none}
  .sb-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:#16233a;
    border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
  .sb-btn:hover{border-color:var(--navy-2);background:#eef3fb}
  .sb-btn .sw{width:14px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.1)}
  .sb-clear{color:var(--red);border-color:#f0c8c3}
  .sb-clear:hover{background:#fdecea;border-color:var(--red)}
  #sb-note{width:200px;padding:6px 9px;font-size:12.5px}
  #sb-plan{width:auto;max-width:260px;padding:6px 9px;font-size:12.5px}
  main.hassel{padding-bottom:230px}
  .rotbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:7px}
  .rotbox label{font-size:12px;font-weight:700;color:#41506b}
  .rotrow{display:flex;gap:8px;flex-wrap:wrap}
  .rotrow select{flex:1 1 220px}
  .cal td.d:hover{outline:2px solid #2a5ea3;outline-offset:-2px;position:relative;z-index:2}
  /* sobota a neděle: tmavší šedomodrý sloupec, záhlaví plné šedomodré (slabší než svátek) */
  .cal td.we{background:#d3dbe7;box-shadow:inset 1px 0 0 #9aa8bd,inset -1px 0 0 #9aa8bd}
  .cal tr.days th.we{background:#5b6b82;color:#fff;font-weight:800}
  .cal tr.days th.we .wd{color:#d3dbe7}
  /* státní svátek: sytě fialový sloupec, záhlaví plné fialové */
  .cal td.hol{background:#d6c1fa}
  .cal tr.days th.hol{background:#7c4dd6;color:#fff;font-weight:800}
  .cal tr.days th.hol .wd{color:#e6d9fb}
  .cal .mstart{border-left:2px solid #c3d0e2}
  .cal tr.days th.today{background:#f6821f;color:#fff;font-weight:800;border-radius:5px}
  .cal-inner{position:relative;width:max-content;min-width:100%}
  /* písmeno v barevném políčku — musí jít přečíst i z dálky */
  .cal td.d .lab{font-size:13px;font-weight:800;color:rgba(16,24,40,.82);pointer-events:none;letter-spacing:-.2px}
  .cal td.shift .lab.lab-sh{font-size:12.5px;color:rgba(14,26,46,.85);font-weight:800;letter-spacing:-.3px}
  @media(max-width:680px){.cal td.d .lab{font-size:11.5px}.cal td.shift .lab.lab-sh{font-size:11px}}
  /* směna naplánovaná pod nepřítomností: jemná modrá linka dole */
  .cal td.hasshift{box-shadow:inset 0 -3px 0 rgba(37,99,168,.4)}
  /* den s poznámkou: tmavý trojúhelník v pravém horním rohu */
  .cal td.d.hasnote{position:relative}
  .cal td.d.hasnote::after{content:'';position:absolute;top:0;right:0;pointer-events:none;
    border-top:9px solid #e8590c;border-left:9px solid transparent}
  /* Dnešek: prázdná políčka lehce oranžová, políčka s nepřítomností nechají svou barvu vyniknout */
  .cal td.today:not(.has){background:#fde3c8}
  /* Pruh dneška = jen oranžové linky po stranách sloupce (nepřekrývá barvy nepřítomností) */
  .today-band{position:absolute;top:0;bottom:0;z-index:2;pointer-events:none;
    box-shadow:inset 3px 0 0 #e8590c,inset -3px 0 0 #e8590c}
  /* svátek pod směnou / nepřítomností: silný fialový pruh nahoře */
  .cal td.holmark{box-shadow:inset 0 5px 0 #7c4dd6}
  /* svátek bez ručního záznamu: celý fialový s „SV" */
  .cal td.d.holday .lab.lab-sv{color:#fff;font-size:11.5px;letter-spacing:.3px}
  /* víkend pod směnou / nepřítomností: šedomodrý pruh nahoře (+ modrá linka dole, je-li tam i směna) */
  .cal td.wemark{box-shadow:inset 0 4px 0 #5b6b82}
  .cal td.wemark.hasshift{box-shadow:inset 0 4px 0 #5b6b82,inset 0 -3px 0 rgba(37,99,168,.4)}
  /* nadpis úseku (skupiny pozic) v kalendáři */
  .cal tr.grp td{background:#e7eefb;border-top:2px solid #c3d0e2;border-bottom:1px solid #c3d0e2;height:24px}
  .cal tr.grp td.grp-name{position:sticky;left:0;z-index:3;text-align:left;padding:0 12px;font-size:11px;
    font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy-2);white-space:nowrap;box-shadow:2px 0 0 #c3d0e2}
  .cal tr.grp td.grp-name .grp-n{opacity:.6;font-weight:600}
  .cal tr.grp:hover td.grp-name{background:#e7eefb}
  .cal td.name .pos{font-weight:500;color:var(--muted);font-size:11.5px}
  .cal tr.grp .grp-add{margin-left:6px;padding:1px 7px;font-size:10px;font-weight:700;text-transform:none;letter-spacing:0;
    background:#fff;border:1px solid #c3d0e2;color:var(--navy-2);border-radius:10px;cursor:pointer;vertical-align:1px}
  .cal tr.grp .grp-add:hover{background:var(--navy-2);color:#fff}
  /* jméno v plánu: kdo smí upravovat, klikne a otevře úpravu */
  .cal td.name.ext.edit{cursor:pointer}
  .cal td.name.ext.edit:hover{color:var(--navy-2);text-decoration:underline}

  .empty-cal{padding:34px;text-align:center;color:var(--muted)}

  /* ---- přihlášení ---- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f2f5f,#2a5ea3);padding:16px}
  .login{background:#fff;border-radius:14px;width:360px;padding:26px;box-shadow:0 22px 55px rgba(0,0,0,.35)}
  .login .brand{margin:0 auto 18px;box-shadow:none;border:1px solid var(--line);width:max-content}
  .login .brand svg{height:56px}
  .login h2{margin:0 0 3px;font-size:18px;text-align:center}
  .login p.s{margin:0 0 18px;font-size:11.5px;color:var(--muted);text-align:center}
  .login .f{margin-bottom:12px}
  .login button{width:100%;padding:10px;font-size:13px}
  .login .hint{margin-top:15px;font-size:11px;color:var(--muted);line-height:1.7;
    border-top:1px solid var(--line);padding-top:12px;text-align:center}
  .loginerr{background:#fdecea;border:1px solid #f5cfca;color:var(--red);font-size:11.5px;
    padding:8px 10px;border-radius:8px;margin-bottom:12px;font-weight:600}

  /* ---- dialog ---- */
  .dlg-wrap{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:center;
    justify-content:center;z-index:80;padding:16px}
  .dlg{background:#fff;border-radius:12px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
  .dlg.dlg-lg{max-width:600px}
  .egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .egrid .f.span2{grid-column:span 2}
  .egrid .f.span3{grid-column:span 3}
  .egrid .f label{font-size:12px;font-weight:700;color:#41506b;margin-bottom:4px;display:block}
  .dlg .b .grow1{flex:1}
  /* potvrzení odebrání osoby z plánování (v okně, ne vyskakovací okénko prohlížeče) */
  .delconf{margin:0 16px 12px;padding:12px 14px;border:2px solid var(--red);border-radius:10px;background:#fdecea;
    color:#7a1d14;font-size:13px;display:flex;flex-direction:column;gap:6px}
  .delconf-b{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .delconf.clearconf{margin:4px 0 0;border-color:#f6821f;background:#fff4e8;color:#7a3b06}
  @media(max-width:560px){.egrid{grid-template-columns:1fr 1fr}.egrid .f.span2,.egrid .f.span3{grid-column:span 2}}

/* ==========================================================
   Dovolenky — evidence nepřítomnosti (Firestore + Auth)
   Kolekce ve Firestore (projekt dovolenky):
     people    — naši lidé  { name, order, createdAt }
     absences  — nepřítomnosti { personId, personName, type, from, to, note, createdBy, createdAt }
   Svátky se do databáze neukládají — počítají se v prohlížeči (české státní svátky).
   ========================================================== */

/* Druhy nepřítomnosti + barvy (světlé, moderní). Svátek je zvláštní – dopočítává se automaticky. */
const TYPES = [
  {k:'Dovolená',        fill:'#f5c518', short:'D'},
  {k:'Náhradní volno',  fill:'#35c1d6', short:'NV'},
  {k:'Nemoc',           fill:'#f2726b', short:'N'},
  {k:'Lékař',           fill:'#e879a6', short:'L'},
  {k:'Neplacené volno', fill:'#9aa7b8', short:'NP'},
  {k:'Služební cesta',  fill:'#5b9df5', short:'SC'},
];
const TYPE_BY = Object.fromEntries(TYPES.map(t=>[t.k,t]));
const HOLIDAY_FILL = '#7c4dd6';
const DEFAULT_VACATION = 25;   // výchozí nárok na dovolenou (pracovních dní za rok)

const MONTHS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
const WD = ['Ne','Po','Út','St','Čt','Pá','So'];

/* Sekce a pozice (musí odpovídat modulu Nastavení). */
const SECTIONS = [
  {key:'engineering', label:'Engineering', positions:['IMM PE','SLUSH PE','FOAM PE','ASSY PE','GB/DP PE','PE coordinator','Change coordinator','ME manager','AME']},
  {key:'maintenance', label:'Maintenance', positions:['Elektrikář','Mechanik','PLC technik','PLC programátor','Skladník','Spareparts Buyer','MAINTENANCE coordinator','Mistr','Shift leader','Nástrojař','Tooling engineer','Toolshop leader']},
  {key:'toolsetters', label:'Toolsetters', positions:['TS IMM','TS SLUSH','TS FOAM','TS GB/DP','TS ASSY']},
];
const POS2SECTION = {}; SECTIONS.forEach(s=>s.positions.forEach(p=>{POS2SECTION[p]=s.key;}));
const inSection = (u,key) => (u.positions||[]).some(p=>POS2SECTION[p]===key);

/* ---- Směny (přítomnost) ---- barvy zeleno-modro-fialové, ať se nepletou s nepřítomnostmi.
   Časy: ranní 6–14, odpolední 14–22, noční 22–6. 12h: ranní 6–18, noční 18–6.
   Salaried = kancelář, pružná ~7:00–15:30, v kalendáři bez písmene (jen zeleně). */
const SHIFTS = [
  {k:'R',   name:'Ranní',         hours:'6:00–14:00',  fill:'#d3ecd0'},
  {k:'O',   name:'Odpolední',     hours:'14:00–22:00', fill:'#cfe0f5'},
  {k:'N',   name:'Noční',         hours:'22:00–6:00',  fill:'#dcd2f3'},
  {k:'D12', name:'Ranní 12h',     hours:'6:00–18:00',  fill:'#bfe6b6'},
  {k:'O12', name:'Odpolední 12h', hours:'14:00–2:00',  fill:'#f3d79c'},
  {k:'N12', name:'Noční 12h',     hours:'18:00–6:00',  fill:'#c8b9ee'},
  {k:'DEN', name:'Denní',         hours:'Po–Pá',       fill:'#e4ecc4'},
  {k:'SAL', name:'Salaried',      hours:'cca 7:00–15:30', fill:'#e2f5e0', noLabel:true, lab:'R'},
];
const SHIFT_BY = Object.fromEntries(SHIFTS.map(s=>[s.k,s]));
/* Které směny se ručně nabízejí v které sekci (rotační plány jsou naopak jednotné). */
const SECTION_SHIFTS = {
  engineering: ['DEN','R','SAL'],
  toolsetters: ['R','O','N','D12','N12'],
  maintenance: ['D12','O12','N12','R','O','N','SAL'],
};
const sectionShifts = key => (SECTION_SHIFTS[key]||[]).map(k=>SHIFT_BY[k]).filter(Boolean);

/* ---- Směnové rotace (automatické rozplánování celého roku jedním kliknutím) ----
   4směnný 12h (týmy H1–H4) je vytěžený z reálného rozpisu „Směny 2026" (28denní
   continental cyklus, kotva 1.1.2026). Ostatní rytmy jsou týdenní, kotva pondělí 5.1.2026.
   Znak v cyklu: D/N/R/O = směna, V = volno. Mapuje se na kódy směn (map).
   Rytmy jsou jednotné pro všechny sekce (Engineering, Maintenance i Toolsetters).
   Noční týden v 3směnném provozu začíná v NEDĚLI (nástup 22:00) a končí čtvrteční
   nocí, pátek je volno — proto je v cyklu N už na neděli předchozího týdne. */
const ROT_PLANS = {
  'SAL':   {label:'Salaried (cca 7:00–15:30)',       anchor:'2026-01-05', cycle:'DDDDDVV', map:{D:'SAL'}},
  /* pořadí týdnů R→N→O / O→R→N / N→O→R (David, 10/2026); týden před nočním končí nedělní N */
  '3SM-R': {label:'Start ranní (R→N→O)',             anchor:'2026-01-05', cycle:'RRRRRVNNNNNVVVOOOOOVV', map:{R:'R',O:'O',N:'N'}},
  '3SM-O': {label:'Start odpolední (O→R→N)',         anchor:'2026-01-05', cycle:'OOOOOVVRRRRRVNNNNNVVV', map:{R:'R',O:'O',N:'N'}},
  '3SM-N': {label:'Start noční (N→O→R)',             anchor:'2026-01-05', cycle:'NNNNVVVOOOOOVVRRRRRVN', map:{R:'R',O:'O',N:'N'}},
  'H1':    {label:'Tým H1',                          anchor:'2026-01-01', cycle:'VDDDVVNNVVVDDVVNNNVVDDVVVNNV', map:{D:'D12',N:'N12'}},
  'H2':    {label:'Tým H2',                          anchor:'2026-01-01', cycle:'DVVVNNVVDDDVVNNVVVDDVVNNNVVD', map:{D:'D12',N:'N12'}},
  'H3':    {label:'Tým H3',                          anchor:'2026-01-01', cycle:'VNNNVVDDVVVNNVVDDDVVNNVVVDDV', map:{D:'D12',N:'N12'}},
  'H4':    {label:'Tým H4',                          anchor:'2026-01-01', cycle:'NVVVDDVVNNNVVDDVVVNNVVDDDVVN', map:{D:'D12',N:'N12'}},
  'DAY-R': {label:'Start ranní (R/O)',               anchor:'2026-01-05', cycle:'RRRRRVVOOOOOVV', map:{R:'R',O:'O'}},
  'DAY-O': {label:'Start odpolední (O/R)',           anchor:'2026-01-05', cycle:'OOOOOVVRRRRRVV', map:{R:'R',O:'O'}},
  'FIXD12':{label:'Ranní 12h (6:00–18:00)',          anchor:'2026-01-05', cycle:'DDDDDVV', map:{D:'D12'}},
  'FIXO12':{label:'Odpolední 12h (14:00–2:00)',      anchor:'2026-01-05', cycle:'DDDDDVV', map:{D:'O12'}},
  'FIXN12':{label:'Noční 12h (18:00–6:00)',          anchor:'2026-01-05', cycle:'DDDDDVV', map:{D:'N12'}},
  'FIXR':  {label:'Ranní (6:00–14:00)',              anchor:'2026-01-05', cycle:'DDDDDVV', map:{D:'R'}},
  // starší klíče (kvůli již uloženým rotacím) – nejsou v nabídce, ale počítají se dál:
  'TS-R':  {label:'Toolsetter – start ranní',        anchor:'2026-01-05', cycle:'RRRRRVVNNNNNVVOOOOOVV', map:{R:'R',N:'N',O:'O'}},
  'TS-N':  {label:'Toolsetter – start noční',        anchor:'2026-01-05', cycle:'NNNNNVVOOOOOVVRRRRRVV', map:{R:'R',N:'N',O:'O'}},
  'TS-O':  {label:'Toolsetter – start odpolední',    anchor:'2026-01-05', cycle:'OOOOOVVRRRRRVVNNNNNVV', map:{R:'R',N:'N',O:'O'}},
  'ENG':   {label:'Denní (Po–Pá)',                   anchor:'2026-01-05', cycle:'DDDDDVV', map:{D:'DEN'}},
};
/* Nabídka rytmů v rozbalovacím seznamu (jednotná pro všechny sekce), s nadpisy skupin. */
const ROT_GROUPS = [
  {label:'Kancelář',                                plans:['SAL']},
  {label:'3směnný provoz (8h, týdenní rotace)',     plans:['3SM-R','3SM-O','3SM-N']},
  {label:'4směnný provoz (12h, 24/7 – dle týmu)',   plans:['H1','H2','H3','H4']},
  {label:'2směnný provoz (8h, ranní/odpolední)',    plans:['DAY-R','DAY-O']},
  {label:'Pevná 12h směna',                         plans:['FIXD12','FIXO12','FIXN12']},
  {label:'1směnný provoz (8h)',                     plans:['FIXR']},
];
const daysSince = (anchor,ds) => Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse(anchor+'T00:00:00Z'))/86400000);
/* Historie rotací osoby jako segmenty {plan, from} seřazené vzestupně.
   Podporuje i starý formát {plan, from} (jeden segment). */
function rotSegments(personId){
  const rot=rotById[personId]; if(!rot) return [];
  let segs = Array.isArray(rot.segments) ? rot.segments.slice()
           : (rot.plan!==undefined ? [{plan:rot.plan, from:rot.from||'0000-01-01'}] : []);
  return segs.filter(s=>s && s.from!=null).sort((a,b)=>String(a.from).localeCompare(String(b.from)));
}
/* Segment platný pro daný den (poslední, jehož „from" je ≤ ds). */
function activeSeg(personId, ds){
  let cur=null; for(const s of rotSegments(personId)){ if(s.from<=ds) cur=s; else break; } return cur;
}
/* Vrátí kód směny pro osobu a den z její rotace (nebo null pro volno / bez rotace).
   Minulost před „from" segmentu se nevyplňuje; starší segmenty zůstávají beze změny. */
function rotationCodeFor(personId, ds){
  const seg=activeSeg(personId, ds); if(!seg || !seg.plan) return null;
  const plan=ROT_PLANS[seg.plan]; if(!plan) return null;
  // segment s vlastní kotvou začíná cyklus od začátku (viz rotAnchor); starší segmenty bez ní jedou podle kotvy plánu
  const L=plan.cycle.length, i=((daysSince(seg.anchor||plan.anchor,ds)%L)+L)%L, tok=plan.cycle[i];
  if(!tok || tok==='V') return null;
  return plan.map[tok] || tok;
}
/* Směna z rytmu pro kalendář a bonusy: na státní svátek rytmus NIC nedosazuje —
   svátky se plánují jen ručně (David, 10/2026), bez záznamu je den fialový „SV".
   VÝJIMKA: týmy H1–H4 (4směnný provoz 24/7) mají svátky jako standardní den — jejich
   rytmus jede přes svátek dál (David, 10/2026). */
function rotCodeOn(personId, ds){
  if(holsOf(+ds.slice(0,4)).get(ds)){
    const seg=activeSeg(personId, ds);
    if(!(seg && /^H\d$/.test(seg.plan||''))) return null;
  }
  return rotationCodeFor(personId, ds);
}
/* Levely (kvůli právům – kdo může měnit koho). */
const LEVEL_RANK = {basic:1,warehouse:2,approver:3,wadmin:4,superadmin:5};
const ROLE2LEVEL = {zadavatel:'basic',skladnik:'warehouse',schvalovatel:'approver',admin:'superadmin'};
const levelOf = d => (d && d.level && LEVEL_RANK[d.level]) ? d.level : ((d && ROLE2LEVEL[d.role]) || 'basic');
/* Práva v Plánování – pro každou sekci 4 stavy. Nejsou-li u člověka nastavená,
   odvodí se z jeho levelu (Approver a výše = vše, ostatní = jen sebe). Nastavují se v Nastavení. */
const PERM_BY = {none:'Skryté', read:'Jen číst', self:'Zapisovat jen sebe', all:'Zapisovat všechny'};
/* Účty založené od 10/2026 mají planStrict:true (David): výchozí je JEN ČÍST, a to jen ve skupině,
   kam patří podle pozice — jinde Skryté. Jakékoli zapisování musí ručně povolit admin v Nastavení.
   Starší účty bez planStrict se řídí levelem jako dřív. */
const defaultPerm = (u, sectionKey) => (u && u.planStrict)
  ? (inSection(u, sectionKey) ? 'read' : 'none')
  : ((LEVEL_RANK[levelOf(u)]||1) >= 3 ? 'all' : 'self');
const resolvePerm = (u, sectionKey) => { const p=u&&u.perms&&u.perms[sectionKey];
  return (p && PERM_BY[p]) ? p : defaultPerm(u, sectionKey); };
/* Přístup k celému modulu Plánování (Skryté/Jen číst/Zapisovat) – zastřeší práva sekcí. */
const resolveModule=(mods,level,key)=>{ const p=mods&&mods[key];
  if(p==='none'||p==='read'||p==='write') return p;
  return key==='nastaveni' ? ((LEVEL_RANK[level]||1)>=5?'write':'none') : 'write'; };
const allowedMods=(mods,level)=>['portal',
  resolveModule(mods,level,'nakup')!=='none'?'nakup':null,
  resolveModule(mods,level,'plan')!=='none'?'dovolenky':null,
  resolveModule(mods,level,'nastaveni')!=='none'?'nastaveni':null].filter(Boolean);
const modCap = () => resolveModule(myDoc&&myDoc.modules, levelOf(myDoc), 'plan');
/* Výsledné právo v sekci = právo sekce omezené přístupem k modulu
   (modul „Jen číst" → i sekce jen čtou; modul „Skryté" → nic). */
/* „Zapisovat jen sebe" už nemá na koho ukázat (jména v plánu nejsou účty),
   proto se chová jako „Jen číst". Zapisuje jen ten, kdo má „Zapisovat všechny". */
const secPerm = s => { let base=resolvePerm(myDoc,s); const cap=modCap();
  if(base==='self') base='read';
  if(cap==='none') return 'none';
  if(cap==='read') return base==='none'?'none':'read';
  return base; };
const curPerm = () => secPerm(section);                      // výsledné právo v aktuální sekci
const canEditAll = () => curPerm()==='all';                  // smí upravovat kohokoli v sekci
const canEditPerson = id => { const pm=curPerm(); return pm==='all' || (pm==='self' && id===(me&&me.uid)); };

/* ---------- stav aplikace ---------- */
let me=null;               // přihlášený uživatel {email, uid}
let allUsers=[];           // všichni lidé v plánování = uživatelé minima + volně vepsaná jména
let userPeople=[];         // lidé z centrálního Nastavení (users)
let extPeople=[];          // volně vepsaná jména bez účtu (kolekce people, ext:true)
let pdlg=null;             // okno „jméno bez účtu" {id|null, name, pos, msg}
let people=[];             // lidé zobrazení v aktuální sekci (počítá se v render)
let myDoc=null;            // záznam přihlášeného (level + práva)
let section='engineering'; // aktivní sekce
let absences=[];           // nepřítomnosti
let shifts=[];             // ručně naplánované směny (přítomnost)
let rotById={};            // rotace (automatické směnové plány) podle personId
const _now0=new Date();
let calYear=_now0.getFullYear();   // rok zobrazený v kalendáři (posouvá se do stran)
let calMonth=_now0.getMonth();     // měsíc v zobrazení „Měsíc" (0 = leden)
/* Zobrazení: 'year' = celý rok s posuvníkem, 'month' = jeden měsíc roztažený na šířku.
   Volba si pamatuje prohlížeč (jen pohodlí jednoho uživatele). */
let calView='year';
let mainTab='plan';                // 'plan' = kalendář sekce, 'bonus' = výpočet bonusů
let bonusYear=_now0.getFullYear(), bonusMonth=_now0.getMonth();
try{ if(localStorage.getItem('plan-view')==='month') calView='month'; }catch(e){}
let alignedYear=null;              // pomocník pro jednorázové zarovnání na aktuální měsíc
let loginBusy=false, loginErr='';
let dlg=null;              // {personName, dateStr, items:[...]} – náhled dne pro toho, kdo jen čte
let sel=null;              // označené dny v kalendáři {personId, a, b} (a = kde výběr začal)
let selNote='';            // poznámka k nepřítomnosti z lišty výběru
let selPlan='';            // rytmus vybraný v liště výběru
let selNoteKey='', selNoteFor=null;   // pro který výběr (a rozsah) je selNote předvyplněná
let activeRow=null;        // zvýrazněný řádek kalendáře (klik do řádku), jako v Nastavení
let rowWasActive=false;    // byl řádek označený už PŘED tímto klikem? (1. klik jen označí)
/* Klik do řádku člověka ho zvýrazní, klik kamkoli mimo kalendář (a mimo lištu a okna)
   zvýraznění zruší. Stav drží activeRow, takže přežije překreslení.
   1. klik do řádku ho jen označí, nabídka (lišta / okno jména) se otevře až 2. klikem. */
document.addEventListener('pointerdown', e=>{
  if(!e.target.closest) return;
  const tr=e.target.closest('.cal tbody tr[data-prow]');
  if(!tr && e.target.closest('.cal-wrap, .selbar, .dlg-wrap')) return;
  rowWasActive = !!tr && activeRow===tr.dataset.prow;
  activeRow = tr ? tr.dataset.prow : null;
  document.querySelectorAll('.cal tbody tr[data-prow]').forEach(r=>r.classList.toggle('active', r.dataset.prow===activeRow));
}, true);
let busySel=false;         // ukládá se výběr
let dragging=false, pendingRender=false;   // během tažení se nepřekresluje (zrušilo by tah)
let collision=null;        // {list:[...], from, to, onOk} – upozornění na kolizi ve stejném úseku
let toastMsg=null, toastKind='';
let calScrollL=0, calScrollT=0;

/* ---------- pomocné ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Příjmení = část e-mailu za tečkou (jan.novak@… → „novak"); bez tečky se vezme
   poslední slovo jména. Podle něj se řadí lidé v tabulce i v seznamech. */
const surname = n => {const p=String(n||'').trim().split(/\s+/);return p[p.length-1]||'';};
const surnameKey = u => { const loc=String((u&&u.email)||'').split('@')[0];
  if(loc.indexOf('.')>=0){ const parts=loc.split('.'); return parts[parts.length-1].toLowerCase(); }
  return surname(u&&u.name).toLowerCase(); };
const bySurname = (a,b)=> surnameKey(a).localeCompare(surnameKey(b),'cs') || String(a.name||'').localeCompare(String(b.name||''),'cs');
function today(){const d=new Date();return iso(d.getFullYear(),d.getMonth(),d.getDate());}
function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
const dCz = ds => {const[y,m,d]=ds.split('-');return `${+d}. ${+m}. ${y}`;};
function toast(m,k=''){toastMsg=m;toastKind=k;render();clearTimeout(toast._t);toast._t=setTimeout(()=>{toastMsg=null;render();},3200);}

/* Velikonoční neděle (Meeus/Jones/Butcher) – pro Velký pátek a Velikonoční pondělí. */
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(y,month-1,day);
}
/* České státní svátky pro daný rok → Map 'YYYY-MM-DD' → název. */
function czHolidays(y){
  const map=new Map();
  const fixed=[[0,1,'Nový rok'],[4,1,'Svátek práce'],[4,8,'Den vítězství'],
    [6,5,'Cyril a Metoděj'],[6,6,'Jan Hus'],[8,28,'Den české státnosti'],
    [9,28,'Vznik ČSR'],[10,17,'Den boje za svobodu'],[11,24,'Štědrý den'],
    [11,25,'1. svátek vánoční'],[11,26,'2. svátek vánoční']];
  fixed.forEach(([m,d,n])=>map.set(iso(y,m,d),n));
  const es=easterSunday(y);
  const gf=new Date(es);gf.setDate(es.getDate()-2);
  const em=new Date(es);em.setDate(es.getDate()+1);
  map.set(iso(gf.getFullYear(),gf.getMonth(),gf.getDate()),'Velký pátek');
  map.set(iso(em.getFullYear(),em.getMonth(),em.getDate()),'Velikonoční pondělí');
  return map;
}

/* Projde všechny dny nepřítomnosti od–do (včetně). */
function eachDay(from,to,cb){
  let d=new Date(from+'T00:00:00'), end=new Date(to+'T00:00:00');
  let guard=0;
  while(d<=end && guard++<800){ cb(iso(d.getFullYear(),d.getMonth(),d.getDate())); d.setDate(d.getDate()+1); }
}
/* Svátky s cache (rychlejší opakované dotazy). */
const _holCache={};
function holsOf(y){ return _holCache[y] || (_holCache[y]=czHolidays(y)); }
const isWorkday = ds => { const dow=new Date(ds+'T00:00:00').getDay();
  return dow!==0 && dow!==6 && !holsOf(+ds.slice(0,4)).get(ds); };
/* Počet pracovních dnů (bez víkendů a svátků) v rozsahu od–do. */
function workingDays(from,to){
  if(!from||!to||to<from) return 0;
  let n=0; eachDay(from,to,ds=>{ if(isWorkday(ds)) n++; });
  return n;
}
/* Plánovat jde každý den včetně víkendů a svátků — co se v kalendáři označí,
   to se naplánuje (David, 10/2026). Nárok na dovolenou (vacStats) dál počítá
   jen pracovní dny. */
const isPlannable = () => true;
/* Počet plánovatelných dnů v rozsahu pro danou osobu. */
function plannableDays(u,from,to){
  if(!from||!to||to<from) return 0;
  let n=0; eachDay(from,to,ds=>{ if(isPlannable(u,ds)) n++; });
  return n;
}
/* Český popis počtu dnů. */
function dayLabel(n){ n=Number(n);
  if(n===0.5) return '0,5 dne';
  if(n===1) return '1 den';
  if(Number.isInteger(n) && n>=2 && n<=4) return n+' dny';
  return String(n).replace('.',',')+' dní'; }

let unsubPeople=null, unsubExt=null, unsubAbs=null, unsubShifts=null, unsubRot=null;
/* Lidé v plánu se zadávají JEN ručně (kolekce people, ext:true) — nejsou propojení
   s účty ani pozicemi uživatelů (rozhodnutí 10/2026). Uživatelé (users) slouží už
   jen k právům přihlášeného (myDoc). */
const mergePeople = () => { allUsers=extPeople.slice(); };

onAuthStateChanged(auth, (user)=>{
  loginBusy=false;
  if(!user){ me=null; loginErr=''; teardown(); render(); return; }
  me={email:user.email, uid:user.uid};

function teardown(){
  if(unsubPeople){unsubPeople();unsubPeople=null;}
  if(unsubExt){unsubExt();unsubExt=null;}
  if(unsubAbs){unsubAbs();unsubAbs=null;}
  if(unsubShifts){unsubShifts();unsubShifts=null;}
  if(unsubRot){unsubRot();unsubRot=null;}
  allUsers=[]; userPeople=[]; extPeople=[]; pdlg=null; people=[]; absences=[]; shifts=[]; rotById={}; myDoc=null;
}
/* Když se některé živé načítání „zasekne" (např. čerstvě publikovaná pravidla
   Firestore, výpadek sítě), po chvíli znovu nahodíme všechny posluchače –
   aby uživatel nemusel ručně načítat stránku. */
let subRetry=0, subRetryTimer=null;
function subErr(label,e){
  toast('Chyba načítání ('+label+'): '+e.message+' – zkouším znovu…','err');
  if(me && subRetry<5 && !subRetryTimer){
    subRetry++;
    subRetryTimer=setTimeout(()=>{ subRetryTimer=null; if(me){ teardown(); subscribe(); } }, 3000);
  }
}
function subscribe(){
  // Lidé se berou z centrálního seznamu (kolekce users) – stejný zdroj jako Nastavení.
  unsubPeople = onSnapshot(collection(db,'users'),
    s=>{ subRetry=0; userPeople=s.docs.map(d=>{const x=d.data();
           return {id:d.id, name:x.name||d.id, email:x.email||'', positions:x.positions||[], level:x.level, role:x.role, perms:x.perms||{}, modules:x.modules||{}, planStrict:!!x.planStrict};});
         mergePeople();
         // bez profilu (ještě nikdy na portálu) = nový účet → jen číst ve vlastní skupině (planStrict)
         myDoc = userPeople.find(u=>u.id===me.uid) || {id:me.uid, positions:[], perms:{}, modules:{}, planStrict:true};
         render(); },
    e=>subErr('lidé',e));
  // Jména bez účtu v minimu (vepsaná přímo v plánování). Ve stejné kolekci můžou
  // ležet staré záznamy z původní aplikace Dovolenky — ty nemají ext:true a ignorují se.
  unsubExt = onSnapshot(collection(db,'people'),
    s=>{ extPeople=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.ext===true)
           .map(x=>({id:x.id, name:x.name||'', email:'', positions:x.pos?[x.pos]:[], ext:true, notes:x.notes||{}}));
         mergePeople(); render(); },
    e=>subErr('jména',e));
  unsubAbs = onSnapshot(collection(db,'absences'),
    s=>{ absences=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    e=>subErr('nepřítomnosti',e));
  unsubShifts = onSnapshot(collection(db,'shifts'),
    s=>{ shifts=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    e=>subErr('směny',e));
  unsubRot = onSnapshot(collection(db,'rotations'),
    s=>{ rotById={}; s.docs.forEach(d=>{rotById[d.id]=d.data();}); render(); },
    e=>subErr('rotace',e));
}

/* ==========================================================
   ZÁPIS DAT
   Plánuje se přímo v kalendáři: tažením (na mobilu dvěma ťuknutími) se v řádku
   člověka označí dny a v liště dole se vybere, co v nich má být. Formuláře
   s datumy nahoře nejsou (David, 10/2026) — nevracej je.
   ========================================================== */
const addDays = (ds,n) => { const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  return iso(d.getFullYear(),d.getMonth(),d.getDate()); };
const selRange = () => sel ? (sel.a<=sel.b ? [sel.a,sel.b] : [sel.b,sel.a]) : null;

/* Uvolní dny od–do v kolekci (absences / shifts): záznamy, které do rozsahu
   zasahují, se smažou a jejich části mimo rozsah se znovu uloží. */
async function clearRange(col, person, from, to){
  const list=(col==='absences'?absences:shifts).filter(r=>r.personId===person.id && r.from<=to && r.to>=from);
  for(const r of list){
    await deleteDoc(doc(db,col,r.id));
    if(r.days===0.5) continue;                       // půlden leží celý v rozsahu
    const {id,...rest}=r;
    const pieces=[];
    if(r.from<from) pieces.push({from:r.from, to:addDays(from,-1)});
    if(r.to>to)     pieces.push({from:addDays(to,1), to:r.to});
    for(const pc of pieces){
      const rec=Object.assign({}, rest, pc, {createdAt:serverTimestamp()});
      if(col==='absences'){ rec.days=plannableDays(person,pc.from,pc.to); if(rec.days<=0) continue; }
      else if(plannableDays(person,pc.from,pc.to)<=0) continue;
      await addDoc(collection(db,col), rec);
    }
  }
}
/* Nepřítomnost do vybraných dnů. half = půl dne (jen u jednoho dne). */
async function applyAbsence(type, half, bypass){
  const p=personById(sel&&sel.personId); const r=selRange(); if(!p||!r) return;
  if(!canEditPerson(p.id)){ toast('Tady můžeš plán jen prohlížet.','err'); return; }
  const [from,to]=r;
  const days = half ? 0.5 : plannableDays(p,from,to);
  if(!(days>0)){ toast('Ve vybraných dnech nejsou žádné plánovatelné dny (víkend / svátek).','err'); return; }
  if(!bypass && type==='Dovolená'){
    const list=findCollisions(p, from, to);
    if(list.length){ collision={list, from, to, onOk:()=>applyAbsence(type, half, true)}; render(); return; }
  }
  busySel=true; render();
  try{
    await clearRange('absences', p, from, to);
    await addDoc(collection(db,'absences'),{ personId:p.id, personName:p.name, type,
      from, to:half?from:to, note:selNote.trim(), days, createdBy:me.email, createdAt:serverTimestamp() });
    toast(`${type}: ${p.name}, ${from===to?dCz(from):dCz(from)+' – '+dCz(to)}.`,'ok');
    sel=null; selNote='';
  }catch(e){ toast('Nepodařilo se uložit: '+e.message,'err'); }
  busySel=false; render();
}

/* Najde kolegy, kteří umí ALESPOŇ JEDNU stejnou pozici a mají v termínu dovolenou
   (kontrola zastupitelnosti napříč sekcemi). */
function findCollisions(person, from, to){
  const myPos=new Set(person.positions||[]);
  if(!myPos.size) return [];
  const list=[];
  allUsers.forEach(o=>{
    if(o.id===person.id) return;
    const shared=(o.positions||[]).filter(p=>myPos.has(p));
    if(!shared.length) return;
    absences.forEach(a=>{
      if(a.personId!==o.id || a.type!=='Dovolená') return;
      if(a.from<=to && a.to>=from) list.push({name:o.name, from:a.from, to:a.to, process:shared.join(', ')});
    });
  });
  return list;
}

/* ---- Rotace (automatické rozplánování celého roku) — v okně jména ---- */
/* Kde začne cyklus nově nastaveného rytmu: týdenní rytmy začínají první směnou
   z popisu (O→R→N začne odpolední) v pondělí tohoto týdne — o víkendu až příští
   pondělí. Týmy H1–H4 kopírují skutečný rozpis týmů, ty mají pevnou kotvu plánu. */
function rotAnchor(planKey, from){
  if(/^H\d$/.test(planKey)) return null;
  const dow=new Date(from+'T00:00:00').getDay();           // 0 = neděle
  return dow===0 ? addDays(from,1) : dow===6 ? addDays(from,2) : addDays(from,1-dow);
}
/* Rytmus se nastavuje od zvoleného dne dál (z okna jména od dneška, z lišty výběru
   od prvního označeného dne). Do minulosti nejde — co už proběhlo, se nepřepisuje.
   Segmenty před tímto dnem zůstanou, ty od něj dál nahradí nový rytmus. */
async function assignRotation(personId, plan, from){
  from=from||today();
  const p=allUsers.find(x=>x.id===personId);
  if(!p){ toast('Vyberte zaměstnance.','err'); return; }
  if(!canEditPerson(p.id)){ toast('Tady můžeš plán jen prohlížet.','err'); return; }
  if(!ROT_PLANS[plan]){ toast('Vyberte směnový rytmus.','err'); return; }
  if(from<today()){ toast('Rytmus nejde nastavit do minulosti — začni nejdřív dneškem.','err'); return; }
  try{
    const past=rotSegments(p.id).filter(s=>s.from<from);
    const anchor=rotAnchor(plan, from);
    const segments=past.concat([anchor?{plan, from, anchor}:{plan, from}]);
    await setDoc(doc(db,'rotations',p.id),{segments, personName:p.name, by:me.email, at:serverTimestamp()});
    toast('Rozplánováno od '+dCz(from)+' dál. Co bylo předtím, zůstalo beze změny.','ok'); pdlg=null; sel=null; render();
  }catch(e){ toast('Nepodařilo se uložit rotaci: '+e.message,'err'); }
}
async function clearRotation(personId, from){
  from=from||today();
  const p=allUsers.find(x=>x.id===personId);
  if(p && !canEditPerson(p.id)){ toast('Tady můžeš plán jen prohlížet.','err'); return; }
  if(from<today()){ toast('Rytmus nejde ukončit v minulosti.','err'); return; }
  try{
    const past=rotSegments(personId).filter(s=>s.from<from);
    if(past.length){   // ponech, co bylo před tímto dnem, od něj rytmus ukonči
      await setDoc(doc(db,'rotations',personId),{segments:past.concat([{plan:'',from}]), by:me.email, at:serverTimestamp()});
    }else{
      await deleteDoc(doc(db,'rotations',personId));
    }
    toast('Rytmus ukončen od '+dCz(from)+'. Co bylo předtím, zůstalo beze změny.','ok'); pdlg=null; sel=null; render();
  }catch(e){ toast('Nepodařilo se zrušit: '+e.message,'err'); }
}
/* „Vymazat plánování" v okně jména: od dneška dál zmizí rytmus I ručně zadané směny.
   Minulost, nepřítomnosti (dovolené…) a poznámky zůstanou. */
const futureShifts = personId => shifts.filter(s=>s.personId===personId && s.to>=today());
async function clearPlanning(personId){
  const from=today();
  const p=allUsers.find(x=>x.id===personId);
  if(!p) return;
  if(!canEditPerson(p.id)){ toast('Tady můžeš plán jen prohlížet.','err'); return; }
  // dva kliky: první ukáže v okně oranžové potvrzení (pdlg.confirmClear), teprve „Ano, vymazat" maže
  if(pdlg && !pdlg.confirmClear){ pdlg.confirmClear=true; pdlg.confirmDel=false; render(); return; }
  try{
    await clearRange('shifts', p, from, '9999-12-31');
    const past=rotSegments(personId).filter(s=>s.from<from);
    if(past.length){   // co bylo před dneškem, zůstane, od dneška rytmus končí
      await setDoc(doc(db,'rotations',personId),{segments:past.concat([{plan:'',from}]), by:me.email, at:serverTimestamp()});
    }else if(rotById[personId]){
      await deleteDoc(doc(db,'rotations',personId));
    }
    toast('Plánování vymazáno od '+dCz(from)+'. Minulost a nepřítomnosti zůstaly.','ok'); pdlg=null; sel=null; render();
  }catch(e){ toast('Nepodařilo se vymazat: '+e.message,'err'); }
}

/* ---- Jména bez účtu ----
   Ne každý, koho plánujeme, má v minimu účet. Takové jméno se vepíše přímo tady
   a uloží do kolekce people {name, pos, ext:true}. V kalendáři se chová stejně
   jako uživatel; upravovat ho smí kdo má v sekci „Zapisovat všechny". */
async function savePerson(){
  const g=id=>document.getElementById(id);
  if(g('pd-name')) pdlg.name=g('pd-name').value;
  if(g('pd-pos')) pdlg.pos=g('pd-pos').value;
  const name=String(pdlg.name||'').trim().replace(/\s+/g,' ');
  if(!canEditAll()){ pdlg.msg='Jména může přidávat jen ten, kdo smí v sekci zapisovat všechny.'; render(); return; }
  if(!name){ pdlg.msg='Napiš jméno.'; render(); return; }
  if(!POS2SECTION[pdlg.pos]){ pdlg.msg='Vyber úsek (pozici).'; render(); return; }
  const dup=allUsers.find(u=>u.id!==pdlg.id && String(u.name||'').trim().toLowerCase()===name.toLowerCase());
  if(dup && !pdlg.dupOk){ pdlg.dupOk=true; pdlg.msg='Člověk se stejným jménem už v plánování je. Klikni na Uložit znovu, pokud jde opravdu o jiného.'; render(); return; }
  try{
    if(pdlg.id){
      await updateDoc(doc(db,'people',pdlg.id),{name, pos:pdlg.pos});
      // jméno se u záznamů ukládá i do personName — přepiš ho, ať historie sedí
      const ren=absences.filter(a=>a.personId===pdlg.id).map(a=>updateDoc(doc(db,'absences',a.id),{personName:name}))
        .concat(shifts.filter(s=>s.personId===pdlg.id).map(s=>updateDoc(doc(db,'shifts',s.id),{personName:name})));
      await Promise.all(ren);
      toast('Uloženo.','ok');
    }else{
      await addDoc(collection(db,'people'),{name, pos:pdlg.pos, ext:true, createdBy:me.email, createdAt:serverTimestamp()});

async function removePerson(){

  const abs=absences.filter(a=>a.personId===p.id), shs=shifts.filter(s=>s.personId===p.id);

      .concat(shs.map(s=>deleteDoc(doc(db,'shifts',s.id)))));
    if(rotById[p.id]) await deleteDoc(doc(db,'rotations',p.id));
    await deleteDoc(doc(db,'people',p.id));

/* Kalendář: při prvním zobrazení roku srovná pohled tak, aby aktuální měsíc
   byl vlevo (ostatní roky na leden). Jinak zachová dosavadní odscrollování. */
function alignCalendar(){
  const wrap=document.querySelector('.cal-wrap'); if(!wrap) return;
  if(calView==='month'){ wrap.scrollTop=calScrollT; return; }   // měsíc se vejde na šířku
  if(calYear!==alignedYear){
    if(!wrap.querySelector('table.cal')){ wrap.scrollLeft=calScrollL; return; } // ještě bez dat – příště
    alignedYear=calYear;
    const now=new Date();
    if(calYear===now.getFullYear()){
      const mob=window.innerWidth<=680, DC=mob?30:34;
      let idx=0; for(let m=0;m<now.getMonth();m++) idx+=new Date(calYear,m+1,0).getDate();
      wrap.scrollLeft=idx*DC;            // první den aktuálního měsíce k levému okraji
    }else wrap.scrollLeft=0;
    calScrollL=wrap.scrollLeft;
  }else{ wrap.scrollLeft=calScrollL; wrap.scrollTop=calScrollT; }
}

/* ==========================================================
   VÝPOČET BONUSŮ — příplatky za směny (David, 10/2026)
   Ručně zadaná 12h směna +200 Kč (12h směny ze směnového rytmu ne — to je jejich
   standard). Směna v sobotu/neděli (podle dne začátku, ruční i z rytmu) +1000 Kč.
   Obojí se sčítá.
   VÝJIMKA: noční N (8h) začínající v neděli ve 22:00 víkendový příplatek nemá —
   nahrazuje páteční noční (WEEKEND_EXEMPT). Platí i pro ruční směnu zadanou na den,
   kdy má člověk podle rytmu tuhle výjimečnou N (např. ruční N12 místo ní → jen 200 Kč).
   Noční z PÁTKU na sobotu je naopak víkendová (WEEKEND_EXTRA) — právě ji nedělní
   noční nahrazuje: 8h N vždy, 12h N12 jen když je zadaná ručně (směna navíc;
   pátečních N12 z rytmu týmů H1–H4 se to netýká).
   Den s celodenní nepřítomností se nepočítá (půl dne dovolené směnu neruší).
   Svátky příplatek nemají. Vidí jen kdo má v sekci „Zapisovat všechny".
   ========================================================== */
const BONUS_12H = 200;
const BONUS_WEEKEND = 1000;
const SHIFTS_12H = ['D12','O12','N12'];
/* Směny, které v daný den týdne (0 = neděle) za víkendové nepočítáme. */
const WEEKEND_EXEMPT = { N: [0] };
/* Směny, které se za víkendové počítají i v jiný den (5 = pátek): noční z pátku na sobotu.
   manual:true = jen když je směna zadaná ručně (ne ze směnového rytmu). */
const WEEKEND_EXTRA = { N: {days:[5]}, N12: {days:[5], manual:true} };
/* Výpočet bonusů vidí JEN ten, kdo má v sekci Toolsetters „Zapisovat všechny" (David, 10/2026).
   Kdo ho vidí, dostane v něm všechny sekce, kde smí zapisovat všechny. */
const canBonus = () => secPerm('toolsetters')==='all';
const bonusSections = () => canBonus() ? SECTIONS.filter(s=>secPerm(s.key)==='all') : [];
const czk = n => n.toLocaleString('cs-CZ')+' Kč';
/* Spočítá příplatky za měsíc pro lidi vybraných sekcí. */
function bonusRows(y, m){
  const from=iso(y,m,1), to=iso(y,m,new Date(y,m+1,0).getDate());
  const abs=absenceMap(from,to), sm=shiftMap(from,to);
  const rows=[];
  bonusSections().forEach(sec=>{
    const secPos=sec.positions;
    allUsers.filter(u=>inSection(u,sec.key)).sort(bySurname).forEach(p=>{
      const r={sec:sec.label, pos:(p.positions||[]).find(x=>secPos.includes(x))||'', name:p.name,
        shifts:0, n12:0, nWe:0, b12:0, bWe:0, total:0, days:[]};
      eachDay(from,to,ds=>{
        const a=(abs[p.id]||{})[ds];
        if(a && a.days!==0.5) return;                  // celý den nepřítomen → žádná směna
        const man=(sm[p.id]||{})[ds];
        const code = man ? man.shift : rotCodeOn(p.id, ds);
        if(!code) return;
        // Týmy H1–H4 (David, 10/2026): víkendy i 12h směny z rytmu jsou jejich standard — bonus
        // jen za směnu NAD rytmus = ručně zadanou na den, kdy mají podle rytmu volno.
        const seg=activeSeg(p.id, ds);
        if(seg && /^H\d$/.test(seg.plan||'') && !(man && !rotCodeOn(p.id, ds))){ r.shifts++; return; }
        // 12h příplatek jen za RUČNĚ zadanou 12h směnu (8h člověk jde na 12h), ne za 12h z rytmu
        const dow=new Date(ds+'T00:00:00').getDay(), h12=!!man && SHIFTS_12H.includes(code);
        // výjimka platí i pro ruční směnu, která jen nahrazuje/prodlužuje výjimečnou směnu
        // z rytmu (ruční N12 místo nedělní N → jen 200 Kč za 12h, ne víkend)
        const exempt=c=>!!c && (WEEKEND_EXEMPT[c]||[]).includes(dow);
        const xtra=WEEKEND_EXTRA[code];
        const weDay=(dow===0||dow===6) || !!(xtra && xtra.days.includes(dow) && (!xtra.manual || man));
        const we=weDay && !exempt(code) && !(man && exempt(rotationCodeFor(p.id, ds)));
        r.shifts++;
        if(h12){ r.n12++; r.b12+=BONUS_12H; }
        if(we){ r.nWe++; r.bWe+=BONUS_WEEKEND; }
        if(h12||we) r.days.push(`${dCz(ds)} ${code}${we?' (víkend)':''}`);
      });
      r.total=r.b12+r.bWe;
      rows.push(r);
    });
  });
  return rows;
}

/* Sestaví strukturu roku (měsíce → dny) i mapu svátků. */
function buildYear(y){
  const hol=czHolidays(y), t=today(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth();
  const months=[];
  for(let m=0;m<12;m++){
    const dim=new Date(y,m+1,0).getDate(), days=[], alt=(m%2===1);
    for(let d=1;d<=dim;d++){
      const ds=iso(y,m,d), dow=new Date(y,m,d).getDay();
      days.push({ds,d,m,alt,first:d===1,mcur:(y===cy&&m===cm&&d===1),dow,
        weekend:(dow===0||dow===6),holiday:hol.get(ds)||'',today:ds===t});
    }
    months.push({name:MONTHS[m],m,alt,days});
  }
  return months;
}
/* Statistika dovolené osoby za zvolený rok: kolik má rozplánováno a kolik zbývá.
   Počítají se jen dny typu „Dovolená" a jen pracovní dny (bez víkendů a svátků). */
function vacStats(personId, year){
  const y=year||calYear, yStart=iso(y,0,1), yEnd=iso(y,11,31);
  let planned=0;
  absences.forEach(a=>{
    if(a.personId!==personId || a.type!=='Dovolená' || !a.from || !a.to) return;
    if(a.days===0.5){                                  // půlden se počítá jako 0,5
      if(a.from>=yStart && a.from<=yEnd) planned+=0.5;
      return;
    }
    if(a.to<yStart || a.from>yEnd) return;
    eachDay(a.from<yStart?yStart:a.from, a.to>yEnd?yEnd:a.to, ds=>{
      if(isWorkday(ds)) planned++;   // jen pracovní dny (víkend ani svátek dovolenou neujídají)
    });
  });
  return {planned, remaining: DEFAULT_VACATION - planned};
}
const personById = id => allUsers.find(u=>u.id===id) || null;
/* Mapa nepřítomností pro rozsah dat: personId → { 'YYYY-MM-DD': absence }.
   Vyplňují se všechny dny rozsahu včetně víkendů a svátků.
   Půlden (days===0.5) je jen jeden den. */
function absenceMap(startDs,endDs){
  const by={};
  absences.forEach(a=>{
    if(!a.from||!a.to) return;
    if(a.days===0.5){                                  // půlden = jediné políčko
      const ds=a.from;
      if(ds<startDs||ds>endDs) return;
      (by[a.personId]||(by[a.personId]={}))[ds]=a;
      return;
    }
    if(a.to<startDs||a.from>endDs) return;
    const pu=personById(a.personId);
    (by[a.personId]||(by[a.personId]={}));
    eachDay(a.from<startDs?startDs:a.from, a.to>endDs?endDs:a.to, ds=>{
      if(isPlannable(pu,ds)) by[a.personId][ds]=a;
    });
  });
  return by;
}
/* Mapa směn (přítomnosti): personId → { 'YYYY-MM-DD': shift }. */
function shiftMap(startDs,endDs){
  const by={};
  shifts.forEach(s=>{
    if(!s.from||!s.to || s.to<startDs || s.from>endDs) return;
    const pu=personById(s.personId);
    (by[s.personId]||(by[s.personId]={}));
    eachDay(s.from<startDs?startDs:s.from, s.to>endDs?endDs:s.to, ds=>{
      if(isPlannable(pu,ds)) by[s.personId][ds]=s;
    });
  });
  return by;
}

function calendarView(){
  if(!people.length){

  }
  const mob=window.innerWidth<=680;
  const NC=mob?110:180, DC=mob?30:34;
  const monthView=calView==='month';
  const yearMonths=buildYear(calYear), months=monthView?[yearMonths[calMonth]]:yearMonths;
  const by=absenceMap(iso(calYear,0,1),iso(calYear,11,31)), sm=shiftMap(iso(calYear,0,1),iso(calYear,11,31));
  const allDays=months.flatMap(mo=>mo.days);
  const sr=selRange();                       // označené dny (tažením)
  // měsíc: sloupce dnů se rozdělí o šířku obrazovky (bez pevné šířky), na úzkém displeji aspoň DC
  const colgroup=`<colgroup><col style="width:${NC}px">${allDays.map(()=>monthView?'<col>':`<col style="width:${DC}px">`).join('')}</colgroup>`;
  const tblStyle=monthView?` style="width:100%;min-width:${NC+allDays.length*DC}px"`:'';
  const monthsRow=`<tr class="months"><th class="corner">${calYear}</th>${
    months.map(mo=>`<th class="mstart ${mo.alt?'malt':''}" colspan="${mo.days.length}">${mo.name}</th>`).join('')}</tr>`;
  const daysRow=`<tr class="days"><th class="corner">Zaměstnanec</th>${
    allDays.map(dd=>{
      let cls='';
      if(dd.holiday)cls='hol'; else if(dd.weekend)cls='we'; else if(dd.alt)cls='malt';
      if(dd.first)cls+=' mstart'; if(dd.mcur)cls+=' mcur';
      if(dd.today)cls+=' today';
      const tt=dd.holiday?`Svátek: ${dd.holiday}`:dCz(dd.ds);
      return `<th class="${cls}" title="${esc(tt)}"><span class="wd">${WD[dd.dow]}</span>${dd.d}</th>`;
    }).join('')}</tr>`;
  // jeden řádek osoby (buňky dnů)
  const personRow = p => {
    const pm=by[p.id]||{}, sp=sm[p.id]||{};
    // efektivní směna dne: ručně zadaná směna má přednost před rotací
    const eff = ds2 => { const mm=sp[ds2]; if(mm) return {code:mm.shift, id:mm.id};
      const rc=rotCodeOn(p.id,ds2); return rc?{code:rc, rot:true}:null; };
    const cells=allDays.map((dd,i)=>{
      const a=pm[dd.ds], s=eff(dd.ds);
      let cls='d', style='', tt=`${p.name} • ${dCz(dd.ds)}`, inner='';
      if(dd.holiday)cls+=' hol'; else if(dd.weekend)cls+=' we'; else if(dd.alt)cls+=' malt';
      if(dd.first)cls+=' mstart'; if(dd.mcur)cls+=' mcur';
      if(dd.today)cls+=' today';
      if(dd.holiday)tt+=` • Svátek: ${dd.holiday}`;
      if(a){
        cls+=' has';                         // má nepřítomnost → dnešek ji nepodbarvuje
        const T=TYPE_BY[a.type]||{fill:'#ccc',short:'?'};
        if(a.days===0.5){                    // půlden: políčko rozdělené úhlopříčně napůl
          style=`background:linear-gradient(135deg, transparent 0 50%, ${T.fill} 50% 100%)`;
          cls+=' half';
        }else{
          style=`background:${T.fill}`;
          const nx=allDays[i+1];             // souvislý pruh: zakryj předěl mezi stejnými dny
          if(nx && !nx.first && pm[nx.ds] && pm[nx.ds].id===a.id) style+=`;border-right-color:${T.fill}`;
        }
        if(dd.holiday)cls+=' holmark'; else if(dd.weekend)cls+=' wemark';
        inner=`<span class="lab">${T.short}</span>`;   // slabé písmeno typu v každé buňce
        tt+=` • ${a.type}${a.days?(' ('+dayLabel(a.days)+')'):''}${a.note?(' — '+a.note):''}`;
        if(s){ cls+=' hasshift'; tt+=` • plánovaná směna: ${SHIFT_BY[s.code]?SHIFT_BY[s.code].name:s.code}`; }
      }else if(s){                            // směna (přítomnost) – jen když tu není nepřítomnost
        cls+=' has shift'+(s.rot?' shift-rot':'');
        const S=SHIFT_BY[s.code]||{fill:'#dfe6ee',name:s.code};
        style=`background:${S.fill}`;
        const nx=allDays[i+1], ns=(nx && !nx.first)?eff(nx.ds):null;   // souvislý pruh stejné směny
        if(ns && ns.code===s.code) style+=`;border-right-color:${S.fill}`;
        if(dd.holiday)cls+=' holmark'; else if(dd.weekend)cls+=' wemark';
        inner = `<span class="lab lab-sh">${esc(S.lab||s.code)}</span>`;   // Salaried zobrazí R (ranní)
        tt+=` • směna ${S.name}${S.hours?(' ('+S.hours+')'):''}${s.rot?' (rotace)':''}`;
      }else if(dd.holiday){                   // svátek bez ručního záznamu: celý fialový „SV"
        cls+=' holday';
        style=`background:${HOLIDAY_FILL}`;
        const nx=allDays[i+1];
        if(nx && !nx.first && nx.holiday && !pm[nx.ds] && !eff(nx.ds)) style+=`;border-right-color:${HOLIDAY_FILL}`;
        inner='<span class="lab lab-sv">SV</span>';
      }
      const dn=(p.notes||{})[dd.ds];
      if(dn){ cls+=' hasnote'; tt+=` • 📝 ${dn}`; }
      if(sr && sel.personId===p.id && dd.ds>=sr[0] && dd.ds<=sr[1]) cls+=' sel';
      return `<td class="${cls}" style="${style}" data-person="${p.id}" data-date="${dd.ds}" title="${esc(tt)}">${inner}</td>`;
    }).join('');
    // pozice za jménem (skupiny jsou podle směny, ne podle pozice)
    const pos=(p.positions||[]).find(x=>POS2SECTION[x]===section)||(p.positions||[])[0]||'';
    const label=`${esc(p.name)}${pos?`<span class="pos"> · ${esc(pos)}</span>`:''}`;
    const tip=`${p.name}${pos?' · '+pos:''}`;
    const nameCell = (p.ext && canEditAll())
      ? `<td class="name ext edit" data-ext="${p.id}" title="${esc(tip)} — kliknutím upravíš nebo odebereš">${label}</td>`
      : p.ext ? `<td class="name ext" title="${esc(tip)}">${label}</td>`
      : `<td class="name" title="${esc(tip)}">${label}</td>`;
    return `<tr data-prow="${p.id}"${activeRow===p.id?' class="active"':''}>${nameCell}${cells}</tr>`;
  };
  // Rozdělení tabulky podle SMĚNY (směnového rytmu platného dnes), ne podle pozice —
  // pozice je za jménem (David, 10/2026). Pořadí skupin jako v nabídce rytmů,
  // kdo rytmus nemá, je dole ve skupině „Bez směnového rytmu".
  const planOrder=ROT_GROUPS.flatMap(g=>g.plans).concat(Object.keys(ROT_PLANS)).filter((k,i,a)=>a.indexOf(k)===i);
  const planOf = p => { const s=activeSeg(p.id, today()); return (s && s.plan && ROT_PLANS[s.plan]) ? s.plan : ''; };
  const groupsByPlan={};
  people.forEach(p=>{ const k=planOf(p); (groupsByPlan[k]||(groupsByPlan[k]=[])).push(p); });
  // uvnitř skupiny po úsecích/pozicích (pořadí jako v SECTIONS), pak podle jména
  const secPos=(SECTIONS.find(s=>s.key===section)||{}).positions||[];
  const posRank = p => { const i=secPos.indexOf((p.positions||[]).find(x=>secPos.includes(x))); return i<0?999:i; };
  const byPos = (a,b) => posRank(a)-posRank(b) || bySurname(a,b);
  const rowsHtml=[];
  planOrder.concat(['']).forEach(k=>{
    const grp=(groupsByPlan[k]||[]).sort(byPos);
    if(!grp.length) return;
    const title = k ? ROT_PLANS[k].label : 'Bez směnového rytmu';
    rowsHtml.push(`<tr class="grp"><td class="name grp-name" title="${esc(title)}">${esc(title)} <span class="grp-n">(${grp.length})</span></td><td class="grp-fill" colspan="${allDays.length}"></td></tr>`);
    grp.forEach(p=>rowsHtml.push(personRow(p)));
  });
  const body=rowsHtml.join('');
  return `<div class="cal-wrap"><div class="cal-inner"${monthView?' style="width:100%"':''}><table class="cal"${tblStyle}>${colgroup}<thead>${monthsRow}${daysRow}</thead><tbody>${body}</tbody></table><div class="today-band" style="display:none"></div></div></div>`;
}

    document.getElementById('pd-rotclear')?.addEventListener('click',()=>clearPlanning(pdlg.id));
    document.getElementById('pd-clear-yes')?.addEventListener('click',()=>clearPlanning(pdlg.id));
    document.getElementById('pd-clear-no')?.addEventListener('click',()=>{pdlg.confirmClear=false; render();});
    document.getElementById('pd-save')?.addEventListener('click',savePerson);
    document.getElementById('pd-del')?.addEventListener('click',removePerson);
    document.getElementById('pd-del-yes')?.addEventListener('click',removePerson);
    document.getElementById('pd-del-no')?.addEventListener('click',()=>{pdlg.confirmDel=false; render();});
    document.getElementById('pd-cancel')?.addEventListener('click',()=>{pdlg=null;render();});
    document.getElementById('pd-x')?.addEventListener('click',()=>{pdlg=null;render();});
    document.getElementById('pd-wrap')?.addEventListener('click',e=>{if(e.target.id==='pd-wrap'){pdlg=null;render();}});
  }

  // lišta výběru dnů
  document.querySelectorAll('[data-abs]').forEach(b=>b.addEventListener('click',()=>
    applyAbsence(b.getAttribute('data-abs'), b.hasAttribute('data-half'))));
  document.querySelectorAll('[data-shift]').forEach(b=>b.addEventListener('click',()=>applyShift(b.getAttribute('data-shift'))));
  document.getElementById('sb-clear')?.addEventListener('click',()=>{
    const r=selRange(); if(r && confirm(`Vymazat nepřítomnosti a ručně naplánované směny ve vybraných dnech (${r[0]===r[1]?dCz(r[0]):dCz(r[0])+' – '+dCz(r[1])})?`)) clearSelection(); });
  document.getElementById('sb-cancel')?.addEventListener('click',()=>{sel=null;render();});
  document.getElementById('sb-plan')?.addEventListener('change',e=>{selPlan=e.target.value;});
  document.getElementById('sb-rot')?.addEventListener('click',()=>{ const r=selRange(); if(r) assignRotation(sel.personId, selPlan, r[0]); });
  document.getElementById('sb-rotclear')?.addEventListener('click',()=>{ const r=selRange();
    if(r && confirm(`Ukončit směnový rytmus od ${dCz(r[0])}? Co bylo předtím, zůstane.`)) clearRotation(sel.personId, r[0]); });
  const sn=document.getElementById('sb-note'); sn?.addEventListener('input',()=>{selNote=sn.value;});
  document.getElementById('sb-savenote')?.addEventListener('click',saveDayNote);

  // náhled dne (pro toho, kdo plán jen prohlíží) — zavírání
  document.getElementById('dlg-x')?.addEventListener('click',()=>{dlg=null;render();});
  document.getElementById('dlg-close')?.addEventListener('click',()=>{dlg=null;render();});
  document.getElementById('dlg-wrap')?.addEventListener('click',e=>{if(e.target.id==='dlg-wrap'){dlg=null;render();}});

  // kalendář: myší se dny označují tažením, na dotykové obrazovce dvěma ťuknutími
  const wrap=document.querySelector('.cal-wrap');
  if(!wrap) return;
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse' || e.button!==0) return;
    const td=e.target.closest('td.d'); if(!td) return;
    const pid=td.getAttribute('data-person'), ds=td.getAttribute('data-date');
    if(!canEditPerson(pid)) return;                     // jen čtení → řeší klik (náhled)
    if(!rowWasActive){ if(sel && sel.personId!==pid){ sel=null; render(); } return; }   // 1. klik jen označí řádek
    e.preventDefault();                                 // ať se při tažení neoznačuje text
    if(e.shiftKey && sel && sel.personId===pid) sel.b=ds;
    else sel={personId:pid, a:ds, b:ds};
    dragging=true; paintSel();
    const move=ev=>{
      const el=document.elementFromPoint(ev.clientX, ev.clientY);
      const c=el && el.closest && el.closest('td.d');
      if(c && c.getAttribute('data-person')===sel.personId && c.getAttribute('data-date')!==sel.b){
        sel.b=c.getAttribute('data-date'); paintSel(); }
    };
    const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      dragging=false; pendingRender=false; render(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
  wrap.addEventListener('click',e=>{
    const ap=e.target.closest('[data-add-pos]'); if(ap){ openPersonDlg(null, ap.getAttribute('data-add-pos')); return; }
    const ex=e.target.closest('td[data-ext]'); if(ex){ if(rowWasActive) openPersonDlg(ex.getAttribute('data-ext')); return; }
    const td=e.target.closest('td.d'); if(!td) return;
    if(!rowWasActive) return;                            // 1. klik jen označil řádek
    const pid=td.getAttribute('data-person'), ds=td.getAttribute('data-date');
    if(!canEditPerson(pid)){ openDay(pid, ds); return; }
    if(e.pointerType==='mouse' || (e.detail>0 && !lastTouch)) return;   // myš už vyřešilo tažení
    // dotyk: 1. ťuknutí = začátek, 2. ťuknutí ve stejném řádku = konec
    if(sel && sel.personId===pid && sel.a===sel.b && ds!==sel.a) sel.b=ds;
    else sel={personId:pid, a:ds, b:ds};
    render();
  });
}
/* Rozlišení dotyku a myši pro klik (pointerType u click události všude není). */
let lastTouch=false;
document.addEventListener('pointerdown',e=>{ lastTouch=(e.pointerType!=='mouse'); }, true);
/* Esc zavře náhled dne, jinak zruší výběr dnů. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(dlg){ dlg=null; render(); return; }
  if(sel && !pdlg && !collision){ sel=null; render(); } });

/* Překreslí jen označení vybraných dnů (při tažení bez celého renderu). */
function paintSel(){
  document.querySelectorAll('.cal td.d.sel').forEach(td=>td.classList.remove('sel'));
  const r=selRange(); if(!r) return;
  document.querySelectorAll(`.cal td.d[data-person="${sel.personId}"]`).forEach(td=>{
    const ds=td.getAttribute('data-date'); if(ds>=r[0] && ds<=r[1]) td.classList.add('sel'); });
}

/* Klik na políčko u toho, kdo plán jen prohlíží → náhled dne bez úprav. */
function openDay(personId,dateStr){
  const p=people.find(x=>x.id===personId); if(!p) return;
  const items=absences.filter(a=>a.personId===personId && a.from<=dateStr && a.to>=dateStr);
  const hol=holsOf(+dateStr.slice(0,4)).get(dateStr)||'';
  // směna toho dne: ručně naplánovaná má přednost před rytmem
  const man=shifts.find(s=>s.personId===personId && s.from<=dateStr && s.to>=dateStr);
  const code=man ? man.shift : rotCodeOn(personId, dateStr);
  dlg={personName:p.name, dateStr, items, holiday:hol, shift:code||'', shiftRot:!man&&!!code,
       note:(p.notes||{})[dateStr]||'', readonly:true};
  render();
}

/* Při změně velikosti okna překresli kalendář, ať se přizpůsobí (mobil ↔ monitor). */
let _rz; window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{ if(me) render(); },160);});
</script>
<script src="header.js"></script>
