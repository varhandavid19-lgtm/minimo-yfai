<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Crect%20width=%27100%27%20height=%27100%27%20rx=%2722%27%20fill=%27%231b4b8f%27/%3E%3Ctext%20x=%2750%27%20y=%2776%27%20font-size=%2774%27%20font-family=%27Arial,sans-serif%27%20font-weight=%27bold%27%20fill=%27white%27%20text-anchor=%27middle%27%3Em%3C/text%3E%3C/svg%3E">
<title>Úkoly pro LAMA AGENCY — YFAI minimo</title>
<link rel="stylesheet" href="header.css">
<style>
  :root{--navy-1:#0f2f5f;--navy-2:#1b4b8f;--bg:#f4f6f9;--card:#fff;--line:#dde4ec;--text:#16233a;--muted:#6b7a90;
    --green:#1f9254;--red:#c0392b;--amber:#b7791f;--blue:#2563a8;
    --teal:#0d7377;--teal-bg:#e4f2f2;--teal-dark:#0a5b5e;--radius:6px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
  button{font-family:inherit;font-size:12px;cursor:pointer;border-radius:var(--radius);border:1px solid transparent;padding:7px 12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fff;color:var(--text);width:100%}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #2a5ea3;outline-offset:1px}
  main{padding:14px 16px 40px}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#41506b}
  .btn-ok{background:var(--green);color:#fff}
  .btn-teal{background:var(--teal);color:#fff;font-weight:700}
  .btn-del{background:#fff;border:1px solid #e3b7b1;color:var(--red);font-weight:600}
  .btn-del:hover{background:var(--red);border-color:var(--red);color:#fff}
  .muted{color:var(--muted)}
  .num{text-align:right;font-variant-numeric:tabular-nums}

  .notice{background:#eef4fc;border:1px solid #cfe0f5;color:#274a74;border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:12.5px}
  .notice.warn{background:#fdf3e2;border-color:#f2dfb8;color:#7a5410}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .panel>h2{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:11px 15px;
    font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .panel>h2 .right{margin-left:auto;font-weight:500;font-size:11px;opacity:.85}
  .panel .body{padding:13px}
  .empty{padding:26px;text-align:center;color:var(--muted)}

  /* záložky seznamů — velká tlačítka jako v ostatních modulech, aktivní tyrkysová */
  .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tab{background:#fff;color:var(--navy-1);border:1.5px solid #c8d6e8;border-radius:9px;
    font-size:14px;font-weight:700;padding:11px 20px;box-shadow:0 1px 2px rgba(15,47,95,.06)}
  .tab:hover{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-dark)}
  /* přetahování úkolu: záložky se nabídnou jako cíl, ta pod myší se rozsvítí */
  body.dragging-task .tab:not(.on){border-style:dashed;border-color:var(--teal)}
  .tab.drop{background:#fdf3e2 !important;border-color:#e8590c !important;border-style:solid !important;transform:scale(1.04)}
  tbody tr[draggable="true"]{cursor:grab}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal-dark);box-shadow:0 2px 6px rgba(13,115,119,.35)}
  .tab .tcount{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:10px;
    background:#eef3fb;color:var(--navy-2);font-size:11px;font-weight:800}
  .tab.on .tcount{background:rgba(255,255,255,.25);color:#fff}
  @media(max-width:680px){.tab{flex:1 1 calc(50% - 4px);padding:11px 8px;font-size:13px}}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:14px}
  .kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy-2);border-radius:var(--radius);padding:11px 13px}
  .kcard .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .kcard .val{font-size:23px;font-weight:800;margin:3px 0 1px}
  .kcard .note{font-size:11px;color:var(--muted)}
  /* okénka jsou zároveň filtr stavu */
  button.kcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    transition:box-shadow .12s,transform .12s}
  button.kcard:hover{box-shadow:0 6px 16px rgba(15,47,95,.12);transform:translateY(-1px)}
  button.kcard.on{background:#e4f2f2;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
  button.kcard.on .lbl{color:var(--teal-dark)}

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .b-blue{background:#eef4fc;color:var(--blue);border-color:#cfe0f5}
  .b-green{background:#e8f6ee;color:var(--green);border-color:#c4e6d3}
  .b-red{background:#fdecea;color:var(--red);border-color:#f5cfca}
  .b-amber{background:#fdf6e6;color:var(--amber);border-color:#f0e0b8}
  .b-grey{background:#eef1f5;color:#4a5a70;border-color:#dfe4ea}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);background:#fafbfd}
  .filters input,.filters select{width:auto;min-width:150px}
  .filters .grow{flex:1 1 240px;max-width:460px}
  label.check{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:#41506b;white-space:nowrap;cursor:pointer;font-weight:600}
  label.check input{width:16px;height:16px;min-width:0;margin:0;flex:none}

  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{background:#1f4677}
  thead th.sortable.on{background:#0d7377}
  thead th .arr{font-size:9px}
  thead th{background:#16355f;color:#fff;text-align:left;padding:9px 10px;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  tbody td{padding:7px 8px;border-bottom:1px solid #eef1f5;vertical-align:top}
  tbody tr:hover td{background:#fafbfd}
  /* řádek pod myší a označený řádek fialově (stejně jako v Nákupu), ať nesplývá s barvami stavů */
  tbody tr[data-a="row-pick"]:hover td{background:#ece3ff !important}
  tbody tr.picked td,tbody tr.picked:hover td{background:#d9c8ff !important}
  tbody tr[data-a="row-pick"]:hover td:first-child,tbody tr.picked td:first-child{box-shadow:inset 4px 0 0 #7c4dd6}
  tbody tr.clickable{cursor:pointer}
  tbody tr.late td{background:#fdecea}
  tbody tr.closed td{background:#e8f6ee;color:#1b5e3a}
  tbody tr.closed td b{color:#1b5e3a}
  td.desc{min-width:180px;white-space:normal}
  td.nowrap{white-space:nowrap}
  .clip{color:#2563a8;font-weight:700;font-size:11px}

  /* ===== okno úkolu ===== */
  .overlay{position:fixed;inset:0;background:rgba(12,26,48,.55);display:flex;align-items:flex-start;
    justify-content:center;padding:24px 14px;overflow:auto;z-index:60}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:880px;margin:auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{background:linear-gradient(90deg,var(--navy-1),var(--navy-2));color:#fff;margin:0;padding:14px 18px;
    font-size:16px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px}
  .modal h3 .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px}
  .robar{padding:9px 16px;background:#eef1f5;border-bottom:1px solid var(--line);font-size:12px;color:#41506b;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .form{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:12.5px;font-weight:700;color:#41506b}
  .f .ro{background:#f4f6f9;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;min-height:35px}
  .f.span2{grid-column:span 2}.f.span4{grid-column:span 4}
  .sect{grid-column:span 4;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
    color:var(--teal-dark);border-bottom:2px solid var(--teal-bg);padding-bottom:5px;margin-top:6px}
  .foot{padding:12px 13px;border-top:1px solid var(--line);background:#fafbfd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hist{padding:0 18px 14px;font-size:11px;color:var(--muted)}
  .hist div{padding:3px 0;border-top:1px dotted var(--line)}
  .hist .hist-h{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#41506b;margin-bottom:3px}
  .hist div.due{color:var(--red);font-weight:700}

  /* přílohy a fotky */
  .photobtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .btn-cam{display:inline-flex;align-items:center;gap:7px;background:var(--teal);color:#fff;font-weight:700;
    border-radius:var(--radius);padding:10px 15px;font-size:13.5px;cursor:pointer}
  .btn-cam:hover{background:var(--teal-dark)}
  .btn-cam input{display:none}
  .filebtn{border:1px dashed #c8d3e0;background:#fafbfd;border-radius:var(--radius);padding:10px 15px;
    font-size:13px;color:#41506b;cursor:pointer;display:inline-block}
  .filebtn input{display:none}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}
  .photo{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f4f6f9}
  .photo img{display:block;width:100%;height:104px;object-fit:cover}
  .photo .doc{display:flex;align-items:center;justify-content:center;height:104px;font-size:26px;color:#8ea0b6;text-decoration:none}
  .photo .nm{font-size:10.5px;padding:4px 6px;color:var(--muted);word-break:break-word;background:#fff}
  .photo .rm{position:absolute;top:4px;right:4px;background:rgba(192,57,43,.92);color:#fff;border:0;
    border-radius:50%;width:24px;height:24px;font-size:13px;line-height:1;padding:0}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#0f2f5f,#2a5ea3);padding:16px}
  .login{background:#fff;border-radius:14px;width:340px;padding:24px;box-shadow:0 22px 55px rgba(0,0,0,.35)}
  .login h2{margin:0 0 2px;font-size:18px;text-align:center}
  .login p{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 16px}
  .login input{margin-bottom:10px}
  .login button{width:100%;padding:10px;font-size:13px;background:var(--navy-2);color:#fff;font-weight:700}
  .loginerr{background:#fdecea;border:1px solid #f5cfca;color:#c0392b;font-size:11.5px;padding:8px 10px;
    border-radius:8px;margin-bottom:10px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16233a;color:#fff;
    padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 26px rgba(0,0,0,.3);z-index:90}
  .toast.ok{background:#157347}
  .toast.err{background:#c0392b}

  @media(max-width:900px){.form{grid-template-columns:repeat(2,1fr)}.f.span4,.sect{grid-column:span 2}}
  /* Telefon: tabulka se rozloží do karet, okno přes celou obrazovku, políčka nad 16 px (iOS jinak zoomuje). */
  @media(max-width:680px){
    main{padding:12px 10px 34px}
    .filters{flex-direction:column;align-items:stretch}
    .filters input,.filters select,.filters .grow,.filters button{width:100%;max-width:none}
    .filters .grow{flex:none}
    .tblwrap{overflow-x:visible}
    thead{display:none}
    tbody tr{display:block;border:1px solid var(--line);border-radius:8px;margin:0 0 11px;padding:6px 12px;background:#fff}
    tbody td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:0;border-bottom:1px solid #eef1f5;text-align:right}
    tbody td:last-child{border-bottom:0}
    tbody td::before{content:attr(data-label);font-weight:700;color:var(--muted);text-align:left;flex:none;
      font-size:11px;text-transform:uppercase}
    tbody tr.late td,tbody tr.closed td{background:none}
    tbody tr.late{border-left:4px solid var(--red)}
    tbody tr.closed{border-left:4px solid var(--green)}
    .overlay{padding:0}
    .modal{border-radius:0;max-width:none;margin:0;min-height:100%}
    .modal h3{border-radius:0;position:sticky;top:0;z-index:3;padding:13px 14px;font-size:15px}
    .modal h3 .x{font-size:26px;padding:0 6px}
    .form{grid-template-columns:1fr;padding:14px}
    .f.span2,.f.span4,.sect{grid-column:span 1}
    .foot{position:sticky;bottom:0;z-index:3;box-shadow:0 -3px 10px rgba(16,35,58,.12);padding:9px 10px;gap:6px}
    .foot>span:first-child{width:100%}
    .foot>span:last-child{width:100%;display:flex;gap:6px;margin-left:0!important}
    .foot button{flex:1 1 0;min-width:0;padding:12px 6px;font-size:12.5px;white-space:nowrap}
    input,select,textarea{font-size:16px}
    .btn-cam,.filebtn{flex:1 1 100%;justify-content:center;text-align:center}
  }
  main.embed{max-width:none;margin:0;padding:0 0 30px}
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><div class="login"><h2>Načítám…</h2><p>Připojuji se k Firebase.</p></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, setDoc,
         query, orderBy, limit, runTransaction }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";

/* Společný Firebase projekt celého portálu. Veřejné frontendové klíče —
   je správné je mít v kódu, zabezpečení řeší pravidla Firestore. */
const firebaseConfig = {
  apiKey: "AIzaSyDi3OVq2Al0WXFPgqhMAN9lPGuExOU80Cc",
  authDomain: "nakupni-pozadavky.firebaseapp.com",
  projectId: "nakupni-pozadavky",
  storageBucket: "nakupni-pozadavky.firebasestorage.app",
  messagingSenderId: "214674774365",
  appId: "1:214674774365:web:7f7b51c8169b75f8acb0b4",
  measurementId: "G-BGDMXEWBQH"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

/* ==========================================================
   Režim „Plánování směn" (David, 10/2026): stejná stránka slouží i záložce
   📋 Požadavky na správce v Plánování směn — dovolenky.html ji vkládá jako
   lama.html?mode=plan&embed=1. Úkoly jsou VLASTNÍ (kolekce plan_tasks, čítač
   meta/plancfg, přílohy plantasks/…), s úkoly LAMA se nemíchají. Přístup má
   každý, kdo v Plánování smí zapisovat (v jakékoli sekci jen sebe / všechny).
   embed=1 = bez hlavičky portálu (je uvnitř Plánování).
   ========================================================== */
const QS = new URLSearchParams(location.search);
const PLAN_MODE = QS.get('mode')==='plan';
const EMBED = QS.get('embed')==='1';
const COLL   = PLAN_MODE ? 'plan_tasks' : 'lama';
const CFG_ID = PLAN_MODE ? 'plancfg'    : 'lamacfg';
const STORE  = PLAN_MODE ? 'plantasks'  : 'lama';
const MOD_NAME = PLAN_MODE ? 'Požadavky na správce (Plánování směn)' : 'Úkoly pro LAMA AGENCY';
if(PLAN_MODE) document.title='Požadavky na správce — Plánování směn — YFAI minimo';

/* ==========================================================
   Kdo do modulu smí
   Výchozí stav: správci podle e-mailu smí zapisovat, ostatní modul vůbec
   nevidí. Komukoli dalšímu (např. teamleaderovi agentury) se přístup nastaví
   v Nastavení → uživatel → Přístup k modulům → Úkoly pro LAMA AGENCY
   (Skryté / Jen číst / Zapisovat). Ruční nastavení má vždy přednost.
   Stejná logika je v index.html, header.js, nastaveni.html
   a v pravidlech Firestore — když ji měníš, uprav ji všude.
   ========================================================== */
const OWNERS = ['david.varhan@yanfeng.com','varhan@minimo.yfai','varhandavid19@gmail.com'];
const isOwner = e => OWNERS.includes(String(e||'').trim().toLowerCase());
/* Plánování: smí zapisovat v aspoň jedné sekci (Zapisovat jen sebe / všechny)?
   Stejná logika práv jako v dovolenky.html (resolvePerm/defaultPerm) a nastaveni.html. */
const PLAN_SEC_KEYS = ['engineering','maintenance','toolsetters'];
const LEVEL_RANK = {basic:1,warehouse:2,approver:3,wadmin:4,superadmin:5};
function planAccess(u){
  if(!u) return 'none';
  const cap=(u.modules||{}).plan;
  if(cap==='none'||cap==='read') return 'none';            // modul Plánování skrytý / jen číst
  const dflt = u.planStrict ? 'read' : ((LEVEL_RANK[u.level]||1)>=3 ? 'all' : 'self');
  const can = PLAN_SEC_KEYS.some(k=>{ const p=(u.perms||{})[k];
    const eff=['none','read','self','all'].includes(p) ? p : dflt; return eff==='self'||eff==='all'; });
  return can ? 'write' : 'none';
}
const lamaAccess = u => {
  if(PLAN_MODE) return planAccess(u);
  if(!u) return 'none';
  const set=(u.modules||{}).lama;
  if(set==='none'||set==='read'||set==='write') return set;
  return isOwner(u.email) ? 'write' : 'none';
};
const canEnter = () => lamaAccess(me)!=='none';
const canWrite = () => lamaAccess(me)==='write';
const canDelete = () => !!me && (me.role==='admin' || isOwner(me.email));

/* ===== číselníky ===== */
const AREAS = ['IMM','Slush','Foaming / Scoring','Assembly IP','Glovebox / Decopart','G463',
               'Sklad a logistika','Údržba a dílna','Kvalita','Zázemí a okolí','Ostatní'];
const STATUS = [
  {k:'nový',     cls:'b-blue',  done:false},
  {k:'v řešení', cls:'b-amber', done:false},
  {k:'hotovo',   cls:'b-green', done:true}
];
/* Priorita — stejné stupně jako v Nákupu. Výchozí je běžná; starší úkoly bez ní taky. */
const PRIORITIES = [
  {k:'kritická', cls:'b-red'},
  {k:'vysoká',   cls:'b-amber'},
  {k:'běžná',    cls:'b-blue'},
  {k:'nízká',    cls:'b-grey'}
];
/* Záložky modulu — každá je samostatný seznam se stejnou tabulkou a stejnými poli.
   Úkol patří do seznamu podle pole `list`; starší úkoly bez něj jsou v „agency".
   Čísla úkolů jdou z jednoho společného čítače (meta/lamacfg.seq) přes všechny záložky. */
const LISTS = PLAN_MODE ? [{k:'plan', label:'Požadavky na správce'}] : [
  {k:'agency',   label:'Úkoly pro LAMA AGENCY'},
  {k:'facility', label:'Facility meeting'},
  {k:'internal', label:'Interní LAMA'},
  {k:'admin',    label:'Požadavky na správce'}
];
const listOf = t => (LISTS.some(l=>l.k===(t&&t.list)) ? t.list : LISTS[0].k);
const listLabel = k => (LISTS.find(l=>l.k===k)||LISTS[0]).label;
const prioOf = t => (PRIORITIES.find(p=>p.k===(t&&t.priority)) || PRIORITIES[2]);
const prioRank = t => PRIORITIES.indexOf(prioOf(t));
const MAX_FILE = 5*1024*1024;      // 5 MB na soubor, stejně jako jinde v minimu
const PHOTO_EDGE = 1600;           // delší hrana fotky po zmenšení
const PHOTO_Q = 0.72;              // kvalita JPEG — typicky pětinová velikost

/* ===== drobné pomůcky ===== */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = s => (window.T ? window.T(s) : s);

const pad2 = n => String(n).padStart(2,'0');
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
/* Text do historie: „změna termínu: 26. 10. 2026 → 2. 11. 2026 (o 7 dní později)".
   Začátek „změna termínu" je značka, podle které se řádek v historii obarví červeně. */
const DUE_MARK = 'změna termínu';
const daysWord = n => n===1?'den':(n>=2&&n<=4?'dny':'dní');
function dueChangeNote(from, to){
  const d=Math.round((Date.parse(to)-Date.parse(from))/86400000), a=Math.abs(d);
  return `${DUE_MARK}: ${dateCz(from)} → ${dateCz(to)} (o ${a} ${daysWord(a)} ${d>0?'později':'dříve'})`;
}
const dateCz = s => { if(!s) return ''; const p=String(s).slice(0,10).split('-');
  return p.length===3 ? `${+p[2]}. ${+p[1]}. ${p[0]}` : String(s); };
const fileSize = b => b>=1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' kB';
const isImg = f => /^image\//i.test(f.type||'') || /\.(jpe?g|png|gif|webp|heic)$/i.test(f.name||'');

const stDef = k => STATUS.find(s=>s.k===k) || STATUS[0];
const isDone = t => stDef(t.status).done;
const isLate = t => !isDone(t) && t.due && t.due < today();
const lateDays = t => isLate(t) ? Math.floor((Date.parse(today())-Date.parse(t.due))/86400000) : 0;

/* Server zamítl zápis — anglické „Missing or insufficient permissions" nikomu nepomůže. */
function writeHint(e){
  const code=(e&&(e.code||e.message))||'';
  if(/permission|insufficient/i.test(String(code))){
    if(PLAN_MODE) return 'Server zápis odmítl. Nejspíš nejsou publikovaná pravidla Firestore pro Požadavky na správce v Plánování — dej vědět Davidovi.';
    return lamaAccess(me)==='read'
      ? 'K úkolům pro LAMA AGENCY máš přístup jen na čtení. O zápis požádej Davida — nastaví ho v Nastavení u tvého jména.'
      : 'Server zápis odmítl. Zkontroluj v Nastavení, že máš u Úkolů pro LAMA AGENCY „Zapisovat". Pokud ano, nejspíš nejsou publikovaná pravidla Firestore.';
  }
  return String((e&&e.message)||e||'Neznámá chyba');
}

async function load(force){
  if(loaded && !force) return;
  errMsg=''; busy='Načítám úkoly…'; render();
  try{
    const qs=await getDocs(query(collection(db,COLL), orderBy('createdOn','desc'), limit(1000)));
    items=qs.docs.map(d=>Object.assign({_id:d.id}, d.data()));
    loaded=true;
  }catch(e){ errMsg=writeHint(e); }
  busy=''; render();
}
/* Číslo úkolu je prosté pořadové číslo — 1, 2, 3… Generuje se TRANSAKCÍ,
   jinak by dva lidi naráz dostali stejné. */
async function nextNo(){
  const ref=doc(db,'meta',CFG_ID);
  const n=await runTransaction(db, async tx=>{
    const s=await tx.get(ref);
    const cur=(((s.data()||{}).seq)||0)+1;
    if(s.exists()) tx.update(ref,{seq:cur}); else tx.set(ref,{seq:cur});
    return cur;
  });
  return String(n);
}
function sync(t){
  if(!t||!t._id) return;
  const i=items.findIndex(x=>x._id===t._id);
  if(i>=0) items[i]=JSON.parse(JSON.stringify(t));
}

/* Rozepsané hodnoty z okna do paměti, ať je překreslení nesmaže. */
function collect(){
  if(!open) return null;
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():'';};
  if(!document.getElementById('lm-task')) return open;     // okno není vykreslené
  Object.assign(open,{
    createdOn:g('lm-created')||open.createdOn, task:g('lm-task'), area:g('lm-area'),
    due:g('lm-due'), status:g('lm-status')||open.status, priority:g('lm-prio')||prioOf(open).k, note:g('lm-note'),
    list:g('lm-list')||listOf(open)
  });
  return open;
}
async function save(){
  const t=collect(); if(!t) return;
  if(!canWrite()){ oMsg='Máš přístup jen na čtení.'; render(); return; }
  if(!t.task){ oMsg='Popiš úkol.'; render(); return; }
  if(!t.due){ oMsg='Vyplň termín.'; render(); return; }
  const closing = isDone(t) && !t.closedOn;
  if(closing){ t.closedOn=today(); t.closedBy=me.name; }   // kdo dokončení zaklikl — jde i do e-mailu
  if(!isDone(t)){ t.closedOn=''; t.closedBy=''; }
  oMsg='Ukládám…'; render();
  try{
    if(!t._id){
      const no=await nextNo();
      const rec={no, createdOn:t.createdOn||today(), createdBy:me.name, task:t.task, area:t.area||'',
        due:t.due, status:t.status, priority:prioOf(t).k, list:listOf(t), closedOn:t.closedOn, closedBy:t.closedBy||'', note:t.note||'', files:[],
        hist:[`${today()} · ${me.name} · úkol zadán (${listLabel(listOf(t))})`]};
      const ref=await addDoc(collection(db,COLL), rec);
      /* přílohy vybrané ještě před uložením nahrajeme teď, když máme id */
      if(pending.length){
        const arr=[], hist=rec.hist.slice();
        for(const fl of pending){
          try{ arr.push(await upload(ref.id,fl)); hist.push(`${today()} · ${me.name} · přidal přílohu ${fl.name}`); }
          catch(e){ toast(T('Příloha ')+fl.name+T(' se nenahrála: ')+((e&&e.message)||e),'err'); }
        }
        if(arr.length){ await updateDoc(ref,{files:arr,hist}); rec.files=arr; rec.hist=hist; }
        pending=[];
      }
      items.unshift(Object.assign({_id:ref.id}, rec));
      toast(T('Úkol ')+no+T(' uložen.'),'ok');
    }else{
      /* Změna termínu se do historie zapíše zvlášť — odkud kam a o kolik dní
         (v okně svítí červeně). Ostatní změny dál jako „upraveno". */
      const orig=items.find(x=>x._id===t._id)||{};
      const add=[];
      if(orig.due && t.due && orig.due!==t.due) add.push(dueChangeNote(orig.due, t.due));
      const moved = listOf(orig)!==listOf(t);   // přesun do jiné záložky
      if(moved) add.push(`přesunuto: ${listLabel(listOf(orig))} → ${listLabel(listOf(t))}`);
      const other=['task','area','status','priority','note','createdOn'].some(k=>String(orig[k]??'')!==String(t[k]??''));
      if(closing) add.push('úkol hotov'); else if(other || !add.length) add.push('upraveno');
      const hist=(t.hist||[]).concat(add.map(a=>`${today()} · ${me.name} · ${a}`));
      const {_id,...data}=t; data.hist=hist;
      await updateDoc(doc(db,COLL,t._id), data);
      t.hist=hist; sync(t);
      toast(moved ? `Úkol ${t.no} přesunut do záložky ${listLabel(listOf(t))}.` : 'Uloženo.','ok');
    }
    open=null; oMsg='';
  }catch(e){ oMsg=T('Uložení selhalo. ')+writeHint(e); }
  render();
}
/* Přesun úkolu do jiné záložky (přetažením řádku na záložku). Stejný zápis do historie
   jako přes pole Záložka v okně úkolu. */
async function moveTask(id, list){
  const t=items.find(x=>x._id===id); if(!t || !canWrite()) return;
  if(!LISTS.some(l=>l.k===list) || listOf(t)===list) return;
  const hist=(t.hist||[]).concat(`${today()} · ${me.name} · přesunuto: ${listLabel(listOf(t))} → ${listLabel(list)}`);
  try{
    await updateDoc(doc(db,COLL,id), {list, hist});
    t.list=list; t.hist=hist;
    toast(`Úkol ${t.no} přesunut do záložky ${listLabel(list)}.`,'ok');
  }catch(e){ toast(T('Přesun se nepovedl. ')+writeHint(e),'err'); }
}
async function removeItem(id){
  const t=items.find(x=>x._id===id); if(!t) return;
  if(!canDelete()) return;
  const n=(t.files||[]).length;
  if(!confirm(`Opravdu smazat úkol ${t.no}?\n\n„${(t.task||'').slice(0,90)}"`
    +(n?`\nSmaže se i ${n===1?'1 příloha':n+' příloh'}.`:'')+'\n\nTohle se nedá vrátit.')) return;
  busy='Mažu úkol…'; render();
  try{
    for(const fl of (t.files||[])){ try{ await deleteObject(sref(storage,fl.path)); }catch(e){ /* nemusí tam být */ } }
    await deleteDoc(doc(db,COLL,id));
    items=items.filter(x=>x._id!==id);
    if(open && open._id===id){ open=null; oMsg=''; }
    toast(T('Úkol ')+t.no+T(' smazán.'),'ok');
  }catch(e){ toast(T('Smazání selhalo. ')+writeHint(e),'err'); }
  busy=''; render();
}

/* ===== přílohy a fotky ===== */
/* Fotku zmenšíme ještě v telefonu, než se nahraje — jinak by šly do úložiště
   čtyřmegové originály. Delší hrana 1600 px, JPEG 0.72. */
async function shrink(f){
  if(!/^image\//i.test(f.type||'') || /svg/i.test(f.type||'')) return f;
  try{
    const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
    const sc=Math.min(1, PHOTO_EDGE/Math.max(bmp.width,bmp.height));
    if(sc>=1 && f.size<=900*1024){ bmp.close && bmp.close(); return f; }
    const w=Math.max(1,Math.round(bmp.width*sc)), h=Math.max(1,Math.round(bmp.height*sc));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    bmp.close && bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',PHOTO_Q));
    if(!blob || blob.size>=f.size) return f;
    return new File([blob], f.name.replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg', lastModified:Date.now()});
  }catch(e){ return f; }
}
async function upload(id, f){
  const safe=f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path=STORE+'/'+id+'/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'_'+safe;
  const st=sref(storage,path);
  await uploadBytes(st,f,{contentType:f.type||'application/octet-stream'});
  return {name:f.name, path, url:await getDownloadURL(st), size:f.size, type:f.type||'', at:today(), by:me.name};
}
async function addFiles(list){
  const t=collect(); if(!t) return;
  if(!canWrite()){ toast('Máš přístup jen na čtení.','err'); return; }
  const raw=[...(list||[])].filter(Boolean); if(!raw.length) return;
  oMsg='Zpracovávám přílohy…'; render();
  const ok=[];
  for(const f0 of raw){
    const fl=await shrink(f0);
    if(fl.size>MAX_FILE){ toast(`„${fl.name}" je větší než 5 MB.`,'err'); continue; }
    ok.push(fl);
  }
  if(!ok.length){ oMsg=''; render(); return; }
  if(!t._id){ pending.push(...ok); oMsg=''; render(); return; }   // nový úkol → nahraje se po uložení
  oMsg='Nahrávám přílohy…'; render();
  const arr=(t.files||[]).slice(), hist=(t.hist||[]).slice();
  let n=0;
  for(const fl of ok){
    try{ arr.push(await upload(t._id,fl)); hist.push(`${today()} · ${me.name} · přidal přílohu ${fl.name}`); n++; }
    catch(e){ toast(T('Nenahrálo se: ')+fl.name+' — '+((e&&e.message)||e),'err'); }
  }
  if(n){
    try{ await updateDoc(doc(db,COLL,t._id), {files:arr, hist});
         t.files=arr; t.hist=hist; sync(t);
         toast(n===1?'Příloha nahrána.':n+T(' příloh nahráno.'),'ok'); }
    catch(e){ toast(T('Uložení příloh selhalo. ')+writeHint(e),'err'); }
  }
  oMsg=''; render();
}
async function removeFile(i){
  const t=collect(); if(!t) return;
  if(!canWrite()) return;
  if(!t._id){ pending.splice(i,1); render(); return; }
  const files=(t.files||[]).slice(), fl=files[i]; if(!fl) return;
  try{ await deleteObject(sref(storage,fl.path)); }catch(e){ /* v úložišti už být nemusí */ }
  files.splice(i,1);
  const hist=(t.hist||[]).concat(`${today()} · ${me.name} · smazal přílohu ${fl.name}`);
  try{ await updateDoc(doc(db,COLL,t._id), {files, hist}); t.files=files; t.hist=hist; sync(t); }
  catch(e){ toast(T('Smazání selhalo. ')+writeHint(e),'err'); }
  render();
}

/* ===== výběr řádků ===== */
function visible(){
  let r=listItems();
  if(f.area)   r=r.filter(t=>t.area===f.area);
  const card=CARDS.find(c=>c.k===f.card);
  if(card) r=r.filter(card.test);
  if(f.priority) r=r.filter(t=>prioOf(t).k===f.priority);
  if(hideDone && f.card!=='done') r=r.filter(t=>!isDone(t));   // okénko Hotovo ukáže hotové vždy
  const q=f.q.trim().toLowerCase();
  if(q) r=r.filter(t=>[t.no,t.task,t.area,t.note,t.createdBy]
    .some(v=>String(v||'').toLowerCase().includes(q)));
  /* řazení kliknutím na sloupec; jinak výchozí pořadí */
  if(sortBy){
    const c=COLS.find(x=>x.k===sortBy.k);
    if(c){ const s=sortBy.dir, val=c.v;
      return r.sort((a,b)=>{ const x=val(a), y=val(b);
        const d = typeof x==='number' ? x-y : String(x).localeCompare(String(y),'cs');
        return d*s || Number(a.no||0)-Number(b.no||0); }); }
  }
  /* výchozí: po termínu nahoru, pak podle priority a termínu, hotové dospod */
  return r.sort((a,b)=>{
    if(isDone(a)!==isDone(b)) return isDone(a)?1:-1;
    if(isLate(a)!==isLate(b)) return isLate(a)?-1:1;
    return prioRank(a)-prioRank(b)
      || String(a.due||'9999').localeCompare(String(b.due||'9999'))
      || Number(a.no||0)-Number(b.no||0);
  });
}

/* ===== ✉️ Notifikace — komu chodí e-maily (jen správce) =====
   Ukládá se do meta/lamacfg.notify, čte ho serverová funkce (functions/index.js):
   nový úkol hned, připomínky (1/3 a 2/3 doby do termínu) a úkoly po termínu
   v ranním přehledu v 7:00. Pravidla Firestore dovolí dokument měnit jen správci. */
async function openNtf(){
  if(!canDelete()) return;
  nMsg=''; ntf={};
  try{ const s=await getDoc(doc(db,'meta',CFG_ID)); ntf=JSON.parse(JSON.stringify((s.exists() && s.data().notify) || {})); }
  catch(e){ nMsg=T('Nastavení se nepodařilo načíst. ')+writeHint(e); }
  LISTS.forEach(l=>{ ntf[l.k]=Object.assign({to:'', newTask:true, done:true, remind:true, overdue:true}, ntf[l.k]||{}); });
  render();
}
function collectNtf(){
  if(!ntf) return;
  LISTS.forEach(l=>{
    const g=id=>document.getElementById(id);
    if(!g('nt-to-'+l.k)) return;
    ntf[l.k]={ to:g('nt-to-'+l.k).value.trim(), newTask:g('nt-new-'+l.k).checked,
      done:g('nt-done-'+l.k).checked, remind:g('nt-rem-'+l.k).checked, overdue:g('nt-late-'+l.k).checked };
  });
}
async function saveNtf(){
  collectNtf();
  const bad=[];
  LISTS.forEach(l=>String(ntf[l.k].to||'').split(/[\s,;]+/).filter(Boolean)
    .forEach(a=>{ if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(a)) bad.push(a); }));
  if(bad.length){ nMsg=T('Tohle nevypadá jako e-mail: ')+bad.join(', '); render(); return; }
  nMsg='Ukládám…'; render();
  try{ await setDoc(doc(db,'meta',CFG_ID),{notify:ntf},{merge:true}); ntf=null; nMsg=''; toast('Notifikace uloženy.','ok'); }
  catch(e){ nMsg=T('Uložení selhalo. ')+writeHint(e); render(); }
}

function exportCsv(){
  const rows=visible();
  const line=a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';');
  const head=['Č.','Zadáno','Zadal','Úkol','Priorita','Oblast / linka','Termín','Stav','Po termínu (dní)',
    'Poznámka / vyjádření agentury','Hotovo','Příloh'];
  const csv=[line(head)].concat(rows.map(t=>line([t.no,t.createdOn,t.createdBy||'',t.task,prioOf(t).k,t.area||'',t.due,
    t.status,isLate(t)?lateDays(t):'',t.note||'',t.closedOn||'',(t.files||[]).length]))).join('\n');
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='lama_'+curList+'_'+today()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

  if(!canEnter()){ appEl.innerHTML=shell(noAccessView()); bind(); window.i18nApply&&window.i18nApply(appEl); return; }
  appEl.innerHTML = shell(`

function bind(){
  const lf=document.getElementById('loginForm');
  if(lf) lf.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById('li-email').value.trim();
    const pass=document.getElementById('li-pass').value;
    loginBusy=true; loginErr=''; render();
    try{ await signInWithEmailAndPassword(auth,email,pass); }
    catch(err){ loginBusy=false; loginErr=loginErrMsg(err.code); render(); }
  };
  const lo=document.getElementById('btn-logout'); if(lo) lo.onclick=()=>signOut(auth);
  /* přetažení řádku úkolu na záložku nahoře = přesun do té záložky */
  document.querySelectorAll('tr[draggable="true"]').forEach(tr=>{
    tr.ondragstart=e=>{ e.dataTransfer.setData('text/lama-id', tr.dataset.v); e.dataTransfer.effectAllowed='move';
      document.body.classList.add('dragging-task'); };
    tr.ondragend=()=>{ document.body.classList.remove('dragging-task');
      document.querySelectorAll('.tab.drop').forEach(t=>t.classList.remove('drop')); };
  });
  document.querySelectorAll('.tab[data-a="list"]').forEach(tab=>{
    const ok=e=>e.dataTransfer && [...e.dataTransfer.types].includes('text/lama-id') && tab.dataset.v!==curList;
    tab.ondragover=e=>{ if(ok(e)){ e.preventDefault(); e.dataTransfer.dropEffect='move'; tab.classList.add('drop'); } };
    tab.ondragleave=()=>tab.classList.remove('drop');
    tab.ondrop=e=>{ e.preventDefault(); tab.classList.remove('drop'); document.body.classList.remove('dragging-task');
      const id=e.dataTransfer.getData('text/lama-id'); if(id) moveTask(id, tab.dataset.v); };
  });
  document.querySelectorAll('[data-a]').forEach(el=>{
    el.onclick=ev=>{ ev.stopPropagation(); act(el.dataset.a, el.dataset.v); };
  });
  /* filtry */
  const q=document.getElementById('lm-q');
  if(q) q.oninput=()=>{ f.q=q.value; const p=q.selectionStart; render();
    const n=document.getElementById('lm-q'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
  for(const [id,key] of [['lm-farea','area'],['lm-fprio','priority']]){
    const el=document.getElementById(id); if(el) el.onchange=()=>{ f[key]=el.value; render(); };
  }
  const hc=document.getElementById('lm-hide'); if(hc) hc.onchange=()=>{ hideDone=hc.checked; render(); };
  /* přílohy — fotoaparát i soubory */
  ['lm-cam','lm-file'].forEach(id=>{ const el=document.getElementById(id);
    if(el) el.onchange=()=>{ if(el.files&&el.files.length) addFiles(el.files); }; });
  const ovl=document.getElementById('ovl');
  if(ovl) ovl.onclick=e=>{ if(e.target.id==='ovl'){ collect(); open=null; oMsg=''; render(); } };
}

async function act(a,v){
  switch(a){
    case 'reload': loaded=false; await load(true); return;
    case 'card': f.card = (f.card===v ? '' : v); break;   // druhý klik filtr zruší
    case 'showall': f={area:'',card:'',priority:'',q:''}; hideDone=false; break;
    case 'sort':{
      const c=COLS.find(x=>x.k===v); if(!c) return;
      if(!sortBy || sortBy.k!==v) sortBy={k:v, dir:c.first};
      else if(sortBy.dir===c.first) sortBy={k:v, dir:-c.first};
      else sortBy=null;                 // třetí klik → výchozí řazení
      break;
    }
    case 'list':
      if(!LISTS.some(l=>l.k===v)) return;
      curList=v; try{ localStorage.setItem(PLAN_MODE?'plantasks-list':'lama-list',v); }catch(e){}
      break;
    case 'new':
      if(!canWrite()) return;
      open=emptyItem(); pending=[]; oMsg='';
      break;
    // řádek tabulky: 1. klik ho označí (fialově), 2. klik na tentýž řádek otevře detail — jako v Nákupu
    case 'row-pick':
      if(pickedTask!==v){ pickedTask=v;
        document.querySelectorAll('tr[data-a="row-pick"]').forEach(r=>r.classList.toggle('picked', r.dataset.v===pickedTask));
        return; }
      return act('open', v);
    case 'open':
      open=JSON.parse(JSON.stringify(items.find(x=>x._id===v)||{}));
      if(!open._id) open=null;
      pending=[]; oMsg='';
      break;
    case 'close': collect(); open=null; oMsg=''; break;
    case 'save': await save(); return;
    case 'del':  await removeItem(v); return;
    case 'delfile': await removeFile(Number(v)); return;
    case 'export': exportCsv(); return;
    case 'ntf': await openNtf(); return;
    case 'ntf-save': await saveNtf(); return;
    case 'ntf-close': ntf=null; nMsg=''; break;
  }
  render();
}
function loginErrMsg(code){
  const m={'auth/invalid-email':'Neplatný e-mail.','auth/user-not-found':'Účet neexistuje.',
    'auth/wrong-password':'Nesprávné heslo.','auth/invalid-credential':'Nesprávný e-mail nebo heslo.',
    'auth/too-many-requests':'Příliš mnoho pokusů, zkuste to za chvíli.',
    'auth/operation-not-allowed':'Přihlašování e-mailem není ve Firebase zapnuté.'};
  return m[code]||('Přihlášení se nezdařilo ('+code+').');
}
